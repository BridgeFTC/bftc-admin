<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFTC | スタッツ比較</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24; --border: #2a2a3a;
    --accent: #e8003d; --gold: #f5c518; --text: #e8e8f0; --text-dim: #7a7a9a;
    --green: #00e57a; --blue: #0099ff; --purple: #9b59b6;
    --playerA: #e8003d; --playerB: #0099ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; }
  .logo span { color: var(--accent); }

  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* INPUT SECTION */
  .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

  .player-input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
  .player-input.playerA { border-top: 3px solid var(--playerA); }
  .player-input.playerB { border-top: 3px solid var(--playerB); }

  .player-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; margin-bottom: 12px; }
  .playerA .player-label { color: var(--playerA); }
  .playerB .player-label { color: var(--playerB); }

  .name-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; padding: 10px 12px; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
  .name-input:focus { border-color: var(--accent); }

  .data-textarea { width: 100%; height: 200px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 12px; padding: 10px 12px; outline: none; resize: vertical; line-height: 1.6; transition: border-color 0.2s; }
  .data-textarea:focus { border-color: var(--accent); }
  .data-textarea::placeholder { color: var(--text-dim); }

  .btn-generate { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 4px; color: white; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; cursor: pointer; transition: all 0.2s; margin-bottom: 32px; }
  .btn-generate:hover { background: #c0002f; }

  /* RESULT SECTION */
  .result-section { display: none; }
  .result-section.visible { display: block; }

  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; border-left: 3px solid var(--accent); padding-left: 12px; }

  /* PLAYER HEADER */
  .player-headers { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .player-header-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; text-align: center; }
  .playerA-card { border-top: 3px solid var(--playerA); }
  .playerB-card { border-top: 3px solid var(--playerB); }
  .ph-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
  .playerA-card .ph-name { color: var(--playerA); }
  .playerB-card .ph-name { color: var(--playerB); }
  .ph-sub { font-size: 12px; color: var(--text-dim); }

  /* RADAR CHART */
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .chart-legend { display: flex; gap: 24px; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

  /* STATS COMPARE TABLE */
  .compare-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
  .compare-block-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; }

  .stat-compare-row { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .stat-compare-row:last-child { border-bottom: none; }

  .stat-val-A { text-align: right; font-weight: 700; font-size: 15px; }
  .stat-val-B { text-align: left; font-weight: 700; font-size: 15px; }
  .stat-name { text-align: center; font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }

  .val-higher { color: var(--green); }
  .val-lower { color: var(--text-dim); }
  .val-equal { color: var(--gold); }

  .bar-wrap { display: flex; align-items: center; gap: 4px; }
  .bar-A { height: 6px; background: var(--playerA); border-radius: 3px; transition: width 0.5s; }
  .bar-B { height: 6px; background: var(--playerB); border-radius: 3px; transition: width 0.5s; }
  .bar-center { display: flex; flex-direction: column; gap: 3px; flex: 1; }

  /* UNIQUE METRICS */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
  .metric-title { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .metric-row:last-child { border-bottom: none; }
  .metric-label { font-size: 13px; }
  .metric-values { display: flex; gap: 16px; }
  .metric-val { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
  .metric-val-A { color: var(--playerA); }
  .metric-val-B { color: var(--playerB); }

  /* STYLE SUMMARY */
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .style-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; }
  .style-card.playerA-card { border-left: 3px solid var(--playerA); }
  .style-card.playerB-card { border-left: 3px solid var(--playerB); }
  .style-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; margin-bottom: 6px; }
  .style-type { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
  .style-desc { font-size: 13px; line-height: 1.8; color: var(--text-dim); }
  .style-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .style-tag { font-size: 11px; padding: 3px 8px; border-radius: 2px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 4px; font-weight: 700; font-size: 13px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999; }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* MATCH SUMMARY */
  .match-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
  .match-summary-vs { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; }
  .match-summary-text { font-size: 15px; line-height: 1.9; color: var(--text); }
  .match-summary-keyword { color: var(--gold); font-weight: 700; }

  .individual-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .individual-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
  .individual-summary-card.playerA-card { border-left: 3px solid var(--playerA); }
  .individual-summary-card.playerB-card { border-left: 3px solid var(--playerB); }
  .individual-summary-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; margin-bottom: 8px; }
  .playerA-card .individual-summary-name { color: var(--playerA); }
  .playerB-card .individual-summary-name { color: var(--playerB); }
  .individual-summary-text { font-size: 13px; line-height: 1.9; color: var(--text-dim); }

  /* CAST SCRIPT */
  .cast-script-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 6px; padding: 24px; margin-bottom: 20px; position: relative; }
  .cast-script-label { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; font-weight: 700; }
  .cast-script-text { font-size: 14px; line-height: 2; color: var(--text); }
  .cast-script-text em { color: var(--gold); font-style: normal; font-weight: 700; }
  .btn-copy { position: absolute; top: 16px; right: 16px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-family: 'Noto Sans JP', sans-serif; font-size: 11px; padding: 4px 10px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
  .btn-copy:hover { border-color: var(--gold); color: var(--gold); }

  @media (max-width: 768px) {
    .input-section, .player-headers, .metrics-grid, .style-grid { grid-template-columns: 1fr; }
  }
</style>

// ===== テキスト解析 =====
function parseFloat2(str) {
  const m = str.replace(/,/g,'').match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}

function parseData(text) {
  const d = {};
  // 改行区切りの場合、項目名と数値が別行になっているので1行に結合する
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  
  // 隣接する行を結合して「項目名 数値」の形にする
  const merged = [];
  for(let i = 0; i < lines.length; i++) {
    const cur = lines[i];
    const next = lines[i+1] || '';
    // 現在行が数値のみ、またはパーセント・回・秒・PTで終わる場合はスキップ
    if(/^[\d.,]+(%|回|秒|PT)?$/.test(cur)) continue;
    // 次行が数値データの場合は結合
    if(next && /^[\d.,]+(%|回|秒|PT)?$/.test(next)) {
      merged.push(cur + ' ' + next);
    } else {
      merged.push(cur);
    }
  }
  
  const fullText = lines.join('\n') + '\n' + merged.join('\n');

  const patterns = [
    { key: 'dp',      regex: /ドライブパリィ\s*([\d.]+)%/ },
    { key: 'di',      regex: /ドライブインパクト\s*([\d.]+)%/ },
    { key: 'od',      regex: /オーバードライブアーツ\s*([\d.]+)%/ },
    { key: 'pdr',     regex: /パリィドライブラッシュ\s*([\d.]+)%/ },
    { key: 'cdr',     regex: /キャンセルドライブラッシュ\s*([\d.]+)%/ },
    { key: 'dr',      regex: /ドライブリバーサル\s*([\d.]+)%/ },
    { key: 'dmg',     regex: /ダメージ\s*([\d.]+)%/ },
    { key: 'drUse',   regex: /使用回数\s*([\d.]+)回/ },
    { key: 'dpSuc',   regex: /成功回数\s*([\d.]+)回/ },
    { key: 'dpThrow', regex: /相手のドライブパリィを投げた\s*([\d.]+)回/ },
    { key: 'dpThrown',regex: /自分のドライブパリィを投げられた\s*([\d.]+)回/ },
    { key: 'justParry',regex: /ジャストパリィ回数\s*([\d.]+)回/ },
    { key: 'diPC',    regex: /パニッシュカウンターを決めた回数\s*([\d.]+)回/ },
    { key: 'diVsdi',  regex: /相手のドライブインパクトに決めた回数\s*([\d.]+)回/ },
    { key: 'diRecvPC',regex: /パニッシュカウンターを受けた回数\s*([\d.]+)回/ },
    { key: 'diReturn',regex: /相手にドライブインパクトで返された回数\s*([\d.]+)回/ },
    { key: 'sa1',     regex: /Lv1\s*([\d.]+)%/ },
    { key: 'sa2',     regex: /Lv2\s*([\d.]+)%/ },
    { key: 'sa3',     regex: /Lv3\s*([\d.]+)%/ },
    { key: 'ca',      regex: /CA\s*([\d.]+)%/ },
    { key: 'throwEsc',regex: /投げ抜け回数\s*([\d.]+)回/ },
    { key: 'wallAtk', regex: /相手を追い詰めている時間\s*([\d.]+)秒/ },
    { key: 'wallDef', regex: /相手に追い詰められている時間\s*([\d.]+)秒/ },
    { key: 'rankMatch',regex: /ランクマッチプレイ回数\s*([\d,]+)回/ },
    { key: 'casual',   regex: /カジュアルマッチプレイ回数\s*([\d,]+)回/ },
    { key: 'room',     regex: /ルームマッチプレイ回数\s*([\d,]+)回/ },
    { key: 'hub',      regex: /バトルハブマッチプレイ回数\s*([\d,]+)回/ },
    { key: 'pts',      regex: /累計プレイポイント\s*([\d,]+)PT/ },
    { key: 'challenge',regex: /チャレンジクリア回数\s*([\d,]+)回/ },
  ];

  patterns.forEach(p => {
    const m = fullText.match(p.regex);
    if(m) d[p.key] = parseFloat(m[1].replace(/,/g,''));
  });

  // 「決めた回数」を DI用と投げ用に分けて取得
  const diHitMatches = fullText.match(/決めた回数\s*([\d.]+)回/g);
  if(diHitMatches && diHitMatches.length >= 1) {
    d.diHit     = parseFloat(diHitMatches[0].match(/([\d.]+)/)[0]);
    d.throwGive = diHitMatches.length >= 2 ? parseFloat(diHitMatches[diHitMatches.length-1].match(/([\d.]+)/)[0]) : 0;
  }

  // 「受けた回数」を DI用と投げ用に分けて取得
  const recvMatches = fullText.match(/受けた回数\s*([\d.]+)回/g);
  if(recvMatches && recvMatches.length >= 1) {
    d.diRecv    = parseFloat(recvMatches[0].match(/([\d.]+)/)[0]);
    d.throwRecv = recvMatches.length >= 2 ? parseFloat(recvMatches[recvMatches.length-1].match(/([\d.]+)/)[0]) : 0;
  }

  // スタン
  const stunGiveM = fullText.match(/スタンさせた回数\s*([\d.]+)回/);
  if(stunGiveM) d.stunGive = parseFloat(stunGiveM[1]);
  const stunRecvM = fullText.match(/スタンさせられた回数\s*([\d.]+)回/);
  if(stunRecvM) d.stunRecv = parseFloat(stunRecvM[1]);

  return d;
}

// ===== 独自指標計算 =====
function calcMetrics(d) {
  // 攻撃圧力指数：CDR + OD + パリィドライブラッシュ
  const attackIdx = Math.min(100, Math.round(((d.cdr||0) + (d.od||0) + (d.pdr||0)) * 0.95));
  // 守備依存度：パリィ + リバーサル + ダメージ消費（ダメージ消費は高いほど不利）
  const defenseIdx = Math.min(100, Math.round(((d.dp||0) + (d.dr||0) + (d.dmg||0)) * 1.2));
  const diIdx = d.di < 2 ? '低' : d.di < 4 ? '中' : '高';
  const wallCtrl = d.wallAtk && d.wallDef ? Math.round((d.wallAtk / (d.wallAtk + d.wallDef)) * 100) : 0;
  const throwRatio = d.throwGive && d.throwRecv ? Math.round((d.throwGive / (d.throwGive + d.throwRecv)) * 100) : 0;
  const saHigh = Math.max(d.sa2||0, d.sa3||0);
  return { attackIdx, defenseIdx, diIdx, wallCtrl, throwRatio, saHigh };
}

// ===== プレイスタイル判定 =====
function getPlayStyle(d, m, name) {
  const tags = [];
  const styles = [];

  // ===== メインスタイル判定（複数条件の組み合わせで細分化） =====
  const wallCtrl = m.wallCtrl || 0;
  const throwRatio = m.throwRatio || 0;

  if(d.cdr >= 40 && d.od >= 25) {
    tags.push('超攻撃特化型'); styles.push('キャンセルドライブラッシュとOD技を軸に、ゲージを惜しみなく攻撃に注ぎ込む超攻撃特化スタイル');
  } else if(d.cdr >= 35 && wallCtrl >= 55) {
    tags.push('壁詰め殲滅型'); styles.push('キャンセルドライブラッシュで一気に距離を詰め、壁際に追い込んでから崩す前進コーナー攻略型');
  } else if(d.cdr >= 35 && d.throwGive >= 2.5) {
    tags.push('接近投げ崩し型'); styles.push('キャンセルドライブラッシュで間合いを詰めて投げを絡める、起き攻め・投げ崩しが得意なスタイル');
  } else if(d.cdr >= 30 && d.pdr >= 8) {
    tags.push('変則ドライブラッシュ型'); styles.push('キャンセルドライブラッシュとパリィドライブラッシュを使い分ける高度なドライブゲージ活用型');
  } else if(d.od >= 30 && d.sa3 >= 30) {
    tags.push('大技連打型'); styles.push('OD技と高レベルSAを軸に、要所で大ダメージを狙う決め手重視の大技連打スタイル');
  } else if(d.od >= 28) {
    tags.push('OD依存型'); styles.push('オーバードライブ技の使用率が突出して高く、ゲージをダメージに直結させる覚醒主義スタイル');
  } else if(d.pdr >= 12 && d.dpSuc >= 2) {
    tags.push('パリィ攻め型'); styles.push('パリィドライブラッシュとパリィ成功を攻撃の起点にする、読み合い重視の攻撃的カウンタースタイル');
  } else if(d.dpSuc >= 3 && d.justParry >= 1) {
    tags.push('神域パリィ型'); styles.push('通常パリィ・ジャストパリィの精度が異常に高い、相手の攻撃を見切ることを軸にした玄人スタイル');
  } else if(d.dpSuc >= 2.5) {
    tags.push('堅守反撃型'); styles.push('パリィ精度が高く、相手の攻撃を受け流してから反撃する守備的カウンタースタイル');
  } else if(d.throwGive >= 3.5 && wallCtrl >= 55) {
    tags.push('投げコーナー支配型'); styles.push('投げを多用して相手をコーナーに追い込み、壁際の攻防で圧倒するグラップラースタイル');
  } else if(d.throwGive >= 3) {
    tags.push('投げ崩し特化型'); styles.push('投げ命中率が際立って高く、打撃と投げの2択を武器に崩しを得意とするグラップラースタイル');
  } else if(wallCtrl >= 65) {
    tags.push('壁際絶対王者型'); styles.push('壁際支配率が圧倒的に高く、一度コーナーに追い込んだら逃さない。コーナーこそが本領のスタイル');
  } else if(wallCtrl >= 55) {
    tags.push('コーナー主導型'); styles.push('壁際での攻防を得意とし、相手をコーナーに追い込んでからの崩しで試合を組み立てるスタイル');
  } else if(d.sa3 >= 45) {
    tags.push('SA3全振り型'); styles.push('SAゲージのLv3集中率が極めて高い。必殺技一発に試合の流れを賭ける豪快な大技主義スタイル');
  } else if(d.sa2 >= 50) {
    tags.push('SA2連打型'); styles.push('SAゲージをLv2で使い続けるコスト効率重視スタイル。隙を見逃さず素早くSAを叩き込む');
  } else if(d.dr >= 2) {
    tags.push('リバーサル依存型'); styles.push('ドライブリバーサルの使用率が高い。守りに入った場面での切り返しを得意とする防御反撃スタイル');
  } else if(m.defenseIdx >= 60 && m.attackIdx <= 40) {
    tags.push('受け師型'); styles.push('ゲージ消耗が多く守備に回る展開が多い。耐えながら相手のミスを誘うじっくり型スタイル');
  } else if(m.attackIdx >= 60) {
    tags.push('積極攻撃型'); styles.push('ゲージを攻撃リソースとして効率よく使う積極攻撃スタイル。前に出て主導権を握ることを好む');
  } else if(m.attackIdx >= 45 && m.defenseIdx <= 35) {
    tags.push('効率攻撃型'); styles.push('ゲージ消耗が少なく攻撃に使えるゲージを常に確保しているタイプ。無駄のない立ち回りが特徴');
  } else if(d.pdr >= 8) {
    tags.push('パリィドライブラッシュ型'); styles.push('パリィドライブラッシュを積極的に使う読み合い重視スタイル。相手の行動を読んで攻めに転じる');
  } else if(d.rankMatch >= 40000) {
    tags.push('歴戦の猛者型'); styles.push('圧倒的な対戦経験値に裏打ちされた安定感が武器。試合の流れを読む能力に長けたベテランスタイル');
  } else {
    tags.push('総合バランス型'); styles.push('特定の武器に偏らず、状況に応じてゲージの使い方を柔軟に変えるオールラウンドなバランス型');
  }

  // ===== サブ特徴を追加 =====
  if(d.justParry >= 1 && !tags.includes('神域パリィ型')) { tags.push('ジャストパリィ使い'); }
  if(d.cdr >= 30 && !tags[0].includes('ドライブラッシュ')) { tags.push('ドライブラッシュ活用'); }
  if(d.dmg >= 28) { tags.push('ゲージ消耗注意'); }
  if(d.rankMatch >= 30000 && !tags.includes('歴戦の猛者型')) { tags.push('ベテラン'); }

  const type = tags[0];
  const desc = styles[0] + '。';

  return { type, desc, tags };
}

// ===== レーダーチャート =====
function drawRadar(dA, dB, nameA, nameB) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = 180;
  ctx.clearRect(0, 0, W, H);

  const axes = [
    { label: '攻撃圧力',  valA: Math.min(100, ((dA.cdr||0)+(dA.od||0)+(dA.pdr||0))*0.95), valB: Math.min(100, ((dB.cdr||0)+(dB.od||0)+(dB.pdr||0))*0.95) },
    { label: '守備消耗', valA: Math.min(100, ((dA.dp||0)+(dA.dr||0)+(dA.dmg||0))*1.2), valB: Math.min(100, ((dB.dp||0)+(dB.dr||0)+(dB.dmg||0))*1.2) },
    { label: '壁際支配', valA: dA.wallAtk&&dA.wallDef ? (dA.wallAtk/(dA.wallAtk+dA.wallDef))*100 : 50, valB: dB.wallAtk&&dB.wallDef ? (dB.wallAtk/(dB.wallAtk+dB.wallDef))*100 : 50 },
    { label: '投げ攻め',  valA: dA.throwGive&&dA.throwRecv ? (dA.throwGive/(dA.throwGive+dA.throwRecv))*100 : 50, valB: dB.throwGive&&dB.throwRecv ? (dB.throwGive/(dB.throwGive+dB.throwRecv))*100 : 50 },
    { label: 'パリィ力', valA: Math.min(100, (dA.dpSuc||0)*20+(dA.justParry||0)*15), valB: Math.min(100, (dB.dpSuc||0)*20+(dB.justParry||0)*15) },
    { label: 'SA活用',   valA: Math.max(dA.sa2||0, dA.sa3||0), valB: Math.max(dB.sa2||0, dB.sa3||0) },
  ];

  const n = axes.length;
  const angleStep = (Math.PI * 2) / n;

  // Grid
  for(let level = 1; level <= 5; level++) {
    const rr = r * level / 5;
    ctx.beginPath();
    for(let i = 0; i < n; i++) {
      const angle = -Math.PI/2 + angleStep * i;
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axes
  for(let i = 0; i < n; i++) {
    const angle = -Math.PI/2 + angleStep * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Labels
    const lx = cx + (r + 28) * Math.cos(angle);
    const ly = cy + (r + 28) * Math.sin(angle);
    ctx.fillStyle = '#7a7a9a';
    ctx.font = 'bold 12px Noto Sans JP';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(axes[i].label, lx, ly);
  }

  // Player polygons
  [
    { vals: axes.map(a => a.valA), color: '#e8003d', alpha: 0.3 },
    { vals: axes.map(a => a.valB), color: '#0099ff', alpha: 0.3 },
  ].forEach(({ vals, color, alpha }) => {
    ctx.beginPath();
    vals.forEach((v, i) => {
      const angle = -Math.PI/2 + angleStep * i;
      const rr = r * Math.min(v, 100) / 100;
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = color + Math.round(alpha * 255).toString(16).padStart(2,'0');
    ctx.fill();
  });
}

// ===== 比較行生成 =====
function makeCompareRow(label, valA, valB, unitA='', unitB='') {
  const a = parseFloat(valA) || 0;
  const b = parseFloat(valB) || 0;
  const max = Math.max(a, b, 0.001);
  const wA = Math.round((a / max) * 100);
  const wB = Math.round((b / max) * 100);
  const clsA = a > b ? 'val-higher' : a < b ? 'val-lower' : 'val-equal';
  const clsB = b > a ? 'val-higher' : b < a ? 'val-lower' : 'val-equal';
  return `
    <div class="stat-compare-row">
      <div style="text-align:right">
        <div class="${clsA}" style="font-weight:700;font-size:15px">${valA}${unitA}</div>
        <div class="bar-wrap" style="justify-content:flex-end">
          <div class="bar-A" style="width:${wA}px;max-width:120px"></div>
        </div>
      </div>
      <div class="stat-name">${label}</div>
      <div>
        <div class="${clsB}" style="font-weight:700;font-size:15px">${valB}${unitB}</div>
        <div class="bar-wrap">
          <div class="bar-B" style="width:${wB}px;max-width:120px"></div>
        </div>
      </div>
    </div>`;
}

  // ===== スプレッドシートに保存 =====

// ===== 個人サマリ生成 =====
function generateIndividualSummary(name, d, m, s, wallCtrl, throwRatio) {
  const lines = [];
  lines.push(`過去100戦平均のバトルの傾向によると、キャンセルドライブラッシュ${d.cdr||0}%・OD技${d.od||0}%・パリィドライブラッシュ${d.pdr||0}%と、ゲージの攻撃活用率は<strong>${m.attackIdx}/100</strong>。`);
  if(wallCtrl >= 55) lines.push(`壁際支配率${wallCtrl}%と高く、コーナーでの崩しを得意とする。`);
  else if(wallCtrl <= 45) lines.push(`壁際支配率${wallCtrl}%と低め。追い詰められる場面が多い傾向がある。`);
  else lines.push(`壁際の攻防は${wallCtrl}%とほぼ互角の展開が多い。`);
  if(throwRatio >= 55) lines.push(`投げ攻勢率${throwRatio}%と投げを積極的に活用する崩し型。`);
  else lines.push(`投げ攻勢率${throwRatio}%。投げよりも技での崩しを好むスタイル。`);
  lines.push(`守備消耗度${m.defenseIdx}/100。${m.defenseIdx >= 50 ? 'ガードによるゲージ消耗が課題となる場面も。' : 'ゲージをしっかり攻撃に回せている。'}`);
  return lines.join('<br>');
}

// ===== プレイスタイル総評の根拠生成 =====
function generateStyleReason(d, m, s, wallCtrl, throwRatio) {
  const type = s.type;
  const parts = [];
  if(type.includes('超攻撃') || type.includes('積極攻撃') || type.includes('OD依存') || type.includes('大技連打')) {
    parts.push(`攻撃圧力指数${m.attackIdx}/100（キャンセルドライブラッシュ${d.cdr||0}%・OD技${d.od||0}%・パリィドライブラッシュ${d.pdr||0}%の合計）`);
  }
  if(type.includes('壁際') || type.includes('コーナー') || type.includes('壁詰め')) {
    parts.push(`壁際支配率${wallCtrl}%（追い詰め${d.wallAtk||0}秒 vs 追い詰められ${d.wallDef||0}秒）`);
  }
  if(type.includes('投げ')) {
    parts.push(`投げ命中${d.throwGive||0}回・投げ攻勢率${throwRatio}%`);
  }
  if(type.includes('パリィ')) {
    parts.push(`パリィ成功${d.dpSuc||0}回・ジャストパリィ${d.justParry||0}回`);
  }
  if(type.includes('SA3')) {
    parts.push(`SA Lv3使用率${d.sa3||0}%`);
  }
  if(type.includes('SA2')) {
    parts.push(`SA Lv2使用率${d.sa2||0}%`);
  }
  if(type.includes('守備') || type.includes('受け師') || type.includes('リバーサル')) {
    parts.push(`守備消耗度${m.defenseIdx}/100・ダメージ消費${d.dmg||0}%`);
  }
  if(parts.length === 0) {
    parts.push(`攻撃圧力指数${m.attackIdx}/100・守備消耗度${m.defenseIdx}/100・壁際支配率${wallCtrl}%の総合判定`);
  }
  return '判定根拠：' + parts.join('、') + '。';
}

// ===== 二つ名の根拠生成 =====
function generateTitleReason(d, m, s, wallCtrl, throwRatio, title) {
  // 壁際・コーナー系
  if(title.includes('壁') || title.includes('コーナー') || title.includes('端') || title.includes('追い詰') || title.includes('逃げ場') || title.includes('封鎖')) {
    const atk = d.wallAtk||0, def = d.wallDef||0;
    const diff = atk - def;
    if(diff > 3) return `相手を壁際に追い詰めている時間が${atk}秒に対し、自分が追い詰められている時間は${def}秒。${diff.toFixed(1)}秒の差でコーナーでの主導権を握っており、壁際で試合を完結させるスタイルが数字に出ているため。`;
    return `壁際支配率${wallCtrl}%・追い詰め時間${atk}秒と、コーナーでの攻勢が数字に表れている。相手を端に追い込んで離さないプレースタイルからこの二つ名に。`;
  }
  // 投げ・掴み系
  if(title.includes('投げ') || title.includes('掴み') || title.includes('組み') || title.includes('鉄腕')) {
    return `投げ命中${d.throwGive||0}回／試合・投げ攻勢率${throwRatio}%。相手の投げ被弾${d.throwRecv||0}回と比較しても投げへの積極性が高く、投げを主軸に崩すスタイルが数字から読み取れるため。`;
  }
  // パリィ・弾き系（ジャストパリィ含む）
  if(title.includes('一瞬') || title.includes('零コンマ') || title.includes('完璧') || title.includes('瞬時') || title.includes('瞬間')) {
    return `ジャストパリィ${d.justParry||0}回・パリィ成功${d.dpSuc||0}回。ジャストパリィは通常のパリィより難しい精密な入力が必要で、これを${d.justParry||0}回以上決めているのは高い反応精度の証明。この精度からこの二つ名に。`;
  }
  if(title.includes('弾いて') || title.includes('パリィ') || title.includes('弾き') || title.includes('弾く')) {
    return `パリィ成功${d.dpSuc||0}回／試合・パリィドライブラッシュ${d.pdr||0}%。パリィを守りだけでなく攻めの起点として使う使用率の高さが数字に表れており、弾いて前に出るスタイルからこの二つ名に。`;
  }
  // 間合い・ドライブラッシュ系
  if(title.includes('間合い') || title.includes('距離') || title.includes('踏み込み') || title.includes('ラッシュ') || title.includes('前進') || title.includes('前へ')) {
    return `キャンセルドライブラッシュ${d.cdr||0}%はドライブゲージ全消費の中で高い割合を占める。積極的に間合いを詰めて攻撃する前進スタイルがデータに明確に表れているため。`;
  }
  // OD・ゲージ爆発系
  if(title.includes('OD') || title.includes('ゲージを爆発') || title.includes('ゲージを惜しまぬ') || title.includes('ゲージを燃やし') || title.includes('ゲージをすべて') || title.includes('ゲージを全弾') || title.includes('ゲージを武器') || title.includes('覚醒')) {
    return `OD技使用率${d.od||0}%はドライブゲージ消費の大きな割合を占める。OD技は通常技より威力・性能が高く、これを積極的に使い続けることでゲージをダメージに直結させるスタイルからこの二つ名に。`;
  }
  // SA3系
  if(title.includes('溜め') || title.includes('フルゲージ') || title.includes('SA3') || title.includes('大技') || title.includes('一発に全て')) {
    return `SAゲージのLv3使用率${d.sa3||0}%と高い割合を記録。Lv3は最大威力のSAで、ゲージを溜めてから一気に使う大技主義のスタイルが数字に表れているため。`;
  }
  // SA2系
  if(title.includes('SA2') || title.includes('中火力') || title.includes('素早く') || title.includes('中奥義')) {
    return `SAゲージのLv2使用率${d.sa2||0}%と高い割合を記録。Lv2はLv3より素早く使えるコスト効率の良いSAで、素早く奥義を当てていくリズム重視のスタイルからこの二つ名に。`;
  }
  // 場数・経験系
  if(title.includes('場数') || title.includes('経験') || title.includes('鍛錬') || title.includes('長年') || title.includes('積み上げ') || title.includes('戦い続け')) {
    return `ランクマッチ${(d.rankMatch||0).toLocaleString()}回・累計${(d.pts||0).toLocaleString()}PTという圧倒的な対戦数が示す通り、長年の実戦経験が戦い方に染み込んでいる。その積み重ねからこの二つ名に。`;
  }
  // 効率・無駄なし系
  if(title.includes('無駄') || title.includes('効率') || title.includes('ゲージ管理') || title.includes('最適')) {
    return `ダメージ消費（ガードによるゲージ消耗）${d.dmg||0}%が低く抑えられており、守備でゲージを削られる場面が少ない。ゲージを攻撃に回せている効率的な立ち回りがデータに表れているため。`;
  }
  // 守備・消耗系
  if(title.includes('削られ') || title.includes('守り') || title.includes('消耗') || title.includes('耐え') || title.includes('ガード')) {
    return `ダメージ消費${d.dmg||0}%・守備消耗度${m.defenseIdx}/100と、ガードでゲージを削られる場面が多い傾向にある。それでも前に出続けるスタイルからこの二つ名に。`;
  }
  // リバーサル系
  if(title.includes('起き上がり') || title.includes('リバーサル') || title.includes('割り込み') || title.includes('逆転')) {
    return `ドライブリバーサル使用率${d.dr||0}%と、起き攻めへの対応でリバーサルを積極的に使用している。守りから一瞬で切り返すスタイルがデータに表れているため。`;
  }
  // 読み合い・地上戦・デフォルト
  // 最も突出した数値1つを根拠にする
  const features = [
    { val: d.cdr||0,       threshold: 25, text: `キャンセルドライブラッシュ${d.cdr||0}%と前進圧力が高く、間合いを詰めて攻め続けるスタイルが数字に表れている。` },
    { val: d.od||0,        threshold: 20, text: `OD技使用率${d.od||0}%と、ゲージを攻撃に使う積極性が数字に表れている。` },
    { val: wallCtrl,       threshold: 50, text: `壁際支配率${wallCtrl}%と、相手をコーナーに追い込む場面が多いことが数字に表れている。` },
    { val: throwRatio,     threshold: 50, text: `投げ攻勢率${throwRatio}%と、投げを絡めた崩しが多いことが数字に表れている。` },
    { val: d.pdr||0,       threshold: 8,  text: `パリィドライブラッシュ${d.pdr||0}%と、弾いてから攻めに転じる場面が多いことが数字に表れている。` },
    { val: d.dpSuc||0,     threshold: 2,  text: `パリィ成功${d.dpSuc||0}回／試合と、相手の攻撃を弾く精度が高いことが数字に表れている。` },
    { val: d.rankMatch||0, threshold: 10000, text: `ランクマッチ${(d.rankMatch||0).toLocaleString()}回という豊富な対戦経験が、読み合いの幅の広さに繋がっている。` },
  ].filter(f => f.val >= f.threshold);

  if(features.length > 0) {
    // 最も値が高い特徴を選ぶ
    const top = features.sort((a, b) => b.val - a.val)[0];
    return top.text + 'この特徴を踏まえてこの二つ名に。';
  }
  return `特定の突出した数値はないが、CDR${d.cdr||0}%・OD${d.od||0}%・壁際支配率${wallCtrl}%のバランスが取れたスタイルからこの二つ名に。`;
}

// ===== マッチアップサマリ生成 =====
function generateMatchSummary(nameA, nameB, dA, dB, mA, mB, sA, sB, wallCtrlA, wallCtrlB) {
  const lines = [];
  const atkDiff = mA.attackIdx - mB.attackIdx;
  const wallDiff = wallCtrlA - wallCtrlB;

  lines.push(`過去100戦平均のバトルの傾向によると、<span class="match-summary-keyword">${nameA}</span>と<span class="match-summary-keyword">${nameB}</span>のマッチアップは、`);

  if(Math.abs(atkDiff) >= 15) {
    const attacker = atkDiff > 0 ? nameA : nameB;
    const defender = atkDiff > 0 ? nameB : nameA;
    lines.push(`攻撃圧力では${attacker}が優位（${Math.max(mA.attackIdx,mB.attackIdx)} vs ${Math.min(mA.attackIdx,mB.attackIdx)}）。${defender}がいかにゲージを守りながら反撃の機会を作れるかが鍵。`);
  } else {
    lines.push(`攻撃圧力は両者ほぼ拮抗（${mA.attackIdx} vs ${mB.attackIdx}）。読み合いの精度が勝敗を分けるカード。`);
  }

  if(Math.abs(wallDiff) >= 10) {
    const wallWinner = wallDiff > 0 ? nameA : nameB;
    lines.push(`壁際支配ではデータ上${wallWinner}が有利。コーナーの攻防がこの試合のハイライトになる可能性が高い。`);
  }

  const styleContrast = sA.type !== sB.type;
  if(styleContrast) {
    lines.push(`スタイルの異なる「${sA.type}」vs「${sB.type}」の好カード。`);
  }

  return lines.join('');
}

// ===== 二つ名生成 =====
function generateTitle(name, d, m, sStyle, wallCtrl, throwRatio) {
  // スタッツに応じた該当カテゴリを収集（カテゴリ単位で管理）
  const categoryPools = [];

  if(d.cdr >= 35)          categoryPools.push({ key: 'cdr_high',      pool: TITLE_POOL.cdr_high });
  if(d.od >= 30)           categoryPools.push({ key: 'od_high',       pool: TITLE_POOL.od_high });
  if(d.pdr >= 10)          categoryPools.push({ key: 'pdr_high',      pool: TITLE_POOL.pdr_high });
  if(wallCtrl >= 60)       categoryPools.push({ key: 'wall_high',     pool: TITLE_POOL.wall_high });
  if(throwRatio >= 60)     categoryPools.push({ key: 'throw_high',    pool: TITLE_POOL.throw_high });
  if(d.dpSuc >= 3)         categoryPools.push({ key: 'parry_high',    pool: TITLE_POOL.parry_high });
  if(d.justParry >= 1)     categoryPools.push({ key: 'just_high',     pool: TITLE_POOL.just_high });
  if(d.sa3 >= 40)          categoryPools.push({ key: 'sa3_high',      pool: TITLE_POOL.sa3_high });
  if(d.sa2 >= 50)          categoryPools.push({ key: 'sa2_high',      pool: TITLE_POOL.sa2_high });
  if(d.sa1 >= 50)          categoryPools.push({ key: 'sa1_high',      pool: TITLE_POOL.sa1_high });
  if(d.di >= 3)            categoryPools.push({ key: 'di_high',       pool: TITLE_POOL.di_high });
  if(d.dr >= 2)            categoryPools.push({ key: 'reversal',      pool: TITLE_POOL.reversal });
  if(d.rankMatch >= 30000) categoryPools.push({ key: 'veteran',       pool: TITLE_POOL.veteran });
  if(m.defenseIdx <= 30)   categoryPools.push({ key: 'efficient',     pool: TITLE_POOL.efficient });
  if(m.defenseIdx >= 60)   categoryPools.push({ key: 'defense',       pool: TITLE_POOL.defense });
  if(wallCtrl <= 45)       categoryPools.push({ key: 'ground_control',pool: TITLE_POOL.ground_control });
  if(m.attackIdx >= 65)    categoryPools.push({ key: 'pressure',      pool: TITLE_POOL.pressure });

  // 常にデフォルトを追加
  categoryPools.push({ key: 'default', pool: TITLE_POOL.default });

  // 候補①：カテゴリをシャッフルして最初の有効な候補を選出
  const shuffledCategories = categoryPools.sort(() => Math.random() - 0.5);

  let t1 = null, t1Category = null;
  for(const cat of shuffledCategories) {
    const available = cat.pool.filter(t => !EXISTING_TITLES.includes(t) && !usedTitles.has(t));
    if(available.length > 0) {
      t1 = available[Math.floor(Math.random() * available.length)];
      t1Category = cat.key;
      break;
    }
  }
  t1 = t1 || TITLE_POOL.default[0];
  t1Category = t1Category || 'default';
  usedTitles.add(t1);

  // 候補②：候補①と異なるカテゴリから選出
  let t2 = null;
  const remainingCategories = shuffledCategories.filter(cat => cat.key !== t1Category);
  for(const cat of remainingCategories) {
    const available = cat.pool.filter(t => !EXISTING_TITLES.includes(t) && !usedTitles.has(t) && t !== t1);
    if(available.length > 0) {
      t2 = available[Math.floor(Math.random() * available.length)];
      break;
    }
  }
  // フォールバック：同カテゴリでも候補①と違うものを選ぶ
  if(!t2) {
    const allAvailable = categoryPools.flatMap(cat => cat.pool).filter(t => !EXISTING_TITLES.includes(t) && !usedTitles.has(t) && t !== t1);
    t2 = allAvailable[Math.floor(Math.random() * allAvailable.length)] || TITLE_POOL.default[1];
  }
  usedTitles.add(t2);

  return [t1, t2];
}

// ===== 実況スクリプト生成 =====
function generateCastScript(nameA, nameB, dA, dB, mA, mB, sA, sB, wallCtrlA, wallCtrlB, throwRatioA, throwRatioB, rankA, rankB, charaA, charaB, opA, opB, titlesA, titlesB) {
  const keyA = sA.tags[0] || 'アグレッシブ';
  const keyB = sB.tags[0] || 'バランス型';

  const infoA = [rankA, charaA, opA].filter(Boolean).join('・');
  const infoB = [rankB, charaB, opB].filter(Boolean).join('・');

  // 二つ名セクションと同じtitlesを使用
  const titleA = titlesA ? titlesA[0] : sA.type;
  const titleB = titlesB ? titlesB[0] : sB.type;

  // キーポイントを多パターンから自動選択
  const keyPoints = [];
  const wallDiff = Math.abs(wallCtrlA - wallCtrlB);
  const throwMax = Math.max(throwRatioA, throwRatioB);
  const throwWinnerName = throwRatioA >= throwRatioB ? nameA : nameB;
  const wallWinnerName = wallCtrlA >= wallCtrlB ? nameA : nameB;
  const wallVal = Math.max(wallCtrlA, wallCtrlB);
  const odMax = Math.max(dA.od||0, dB.od||0);
  const odWinner = (dA.od||0) >= (dB.od||0) ? nameA : nameB;
  const cdrMax = Math.max(dA.cdr||0, dB.cdr||0);
  const cdrWinner = (dA.cdr||0) >= (dB.cdr||0) ? nameA : nameB;
  const parryMax = Math.max(dA.dpSuc||0, dB.dpSuc||0);
  const parryWinner = (dA.dpSuc||0) >= (dB.dpSuc||0) ? nameA : nameB;
  const sa3Max = Math.max(dA.sa3||0, dB.sa3||0);
  const sa3Winner = (dA.sa3||0) >= (dB.sa3||0) ? nameA : nameB;

  if(wallDiff >= 10 && (dA.wallAtk||0) > (dA.wallDef||0) && (dB.wallAtk||0) > (dB.wallDef||0)) keyPoints.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wallWinnerName}の壁際支配率は${wallVal}%。コーナーに追い込んだ後の崩しパターンに注目してください。`);
  else if((dA.wallDef||0) > (dA.wallAtk||0) && (dB.wallDef||0) > (dB.wallAtk||0)) keyPoints.push(`両者ともに壁を背負う時間の方が長いデータが出ています。コーナーではなく<em>地上戦・中距離の攻防</em>がこの試合の主戦場になりそうです。差し合いと間合い管理の精度が勝敗を分けます。`);
  if(throwMax >= 55) keyPoints.push(`<em>投げの読み合い</em>も見逃せません。${throwWinnerName}の投げ攻勢率${throwMax}%と、接近戦での投げ択が試合の流れを左右しそうです。`);
  if(odMax >= 28) keyPoints.push(`<em>OD技の使いどころ</em>がこの試合の分岐点になりそうです。${odWinner}のOD技使用率${odMax}%。ゲージが残っている場面での強行動に注目。`);
  if(cdrMax >= 35) keyPoints.push(`<em>ドライブラッシュへの対応</em>が鍵を握ります。${cdrWinner}のキャンセルドライブラッシュ${cdrMax}%は高水準。間合い管理と迎撃タイミングが勝負の分かれ目。`);
  if(parryMax >= 2.5) keyPoints.push(`<em>パリィの読み合い</em>にも注目です。${parryWinner}のパリィ成功${parryMax}回は高水準。単調な連携は危険、投げや遅らせで崩す工夫が求められます。`);
  if(sa3Max >= 40) keyPoints.push(`<em>必殺技のタイミング</em>も見どころです。${sa3Winner}のSA3使用率${sa3Max}%。大技を溜めている状況での読み合いがこの試合のクライマックスになりそうです。`);

  // キーポイントが少ない場合は壁際をデフォルトで追加
  if(keyPoints.length === 0) keyPoints.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wallWinnerName}の壁際支配率${wallVal}%。コーナーでの攻防に注目してください。`);

  // 最大2つ選出
  const selectedPoints = keyPoints.slice(0, 2).join('<br>');

  return `
    さあ始まりました！本日の注目カードは<em>${nameA}</em> vs <em>${nameB}</em>！<br><br>
    今回の対戦会における二つ名は、${nameA}が<em>『${titleA}』</em>、${nameB}が<em>『${titleB}』</em>です。<br><br>
    ${infoA ? `${nameA}は<em>${infoA}</em>。` : ''}過去100戦平均のバトルの傾向によると、${nameA}のプレイスタイルは<em>${keyA}</em>型。
    キャンセルドライブラッシュ${dA.cdr||0}%、OD技${dA.od||0}%と、ゲージを攻撃に集中させる前線圧力型プレイヤーです。<br><br>
    ${infoB ? `対する${nameB}は<em>${infoB}</em>。` : `対する${nameB}は`}<em>${keyB}</em>型。
    ${(dB.throwGive||0) > 3 ? `投げ命中${dB.throwGive||0}回と投げを絡めた崩しが武器。` : `パリィドライブラッシュ${dB.pdr||0}%とゲージの使い分けが巧みなプレイヤー。`}<br><br>
    ${selectedPoints}<br><br>
    それでは、試合開始です！<br><br>
    <span style="font-size:12px;color:var(--text-dim);border-top:1px solid var(--border);display:block;padding-top:12px;margin-top:8px;">
      📌 二つ名候補（${nameA}）：『${titlesA[0]}』／『${titlesA[1]}』<br>
      📌 二つ名候補（${nameB}）：『${titlesB[0]}』／『${titlesB[1]}』
    </span>
  `;
}

// ===== X投稿文生成 =====
function generateXPost(nameA, nameB, titleA, titleB, charaA, charaB, styleA, styleB) {
  const charaLineA = charaA ? `（${charaA}／${styleA}）` : `（${styleA}）`;
  const charaLineB = charaB ? `（${charaB}／${styleB}）` : `（${styleB}）`;
  const text = `⚔️ 対戦カード紹介

${nameA} ${charaLineA}
今回の二つ名「${titleA}」

vs

${nameB} ${charaLineB}
今回の二つ名「${titleB}」

#BridgeFTC`;
  return text.length <= 140 ? text : text.slice(0, 137) + '...';
}

// ===== X投稿コピー =====
function copyXPost() {
  const el = document.getElementById('xPostText');
  navigator.clipboard.writeText(el.innerText).then(() => showToast('✓ X投稿文をコピーしました'));
}

// ===== コピー =====
function copyScript() {
  const el = document.getElementById('castScriptText');
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => showToast('✓ スクリプトをコピーしました'));
}
</script>
</body>
