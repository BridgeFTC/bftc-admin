<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFTC | スタッツ比較</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
  :root {
    --bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a3a;
    --accent:#e8003d;--gold:#f5c518;--text:#e8e8f0;--text-dim:#7a7a9a;
    --green:#00e57a;--blue:#0099ff;--purple:#9b59b6;
    --playerA:#e8003d;--playerB:#0099ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;min-height:100vh;}
  header{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;}
  .logo span{color:var(--accent);}
  .container{max-width:1200px;margin:0 auto;padding:32px 24px;}
  .input-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .player-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .player-input.playerA{border-top:3px solid var(--playerA);}
  .player-input.playerB{border-top:3px solid var(--playerB);}
  .player-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;margin-bottom:12px;}
  .playerA .player-label{color:var(--playerA);}
  .playerB .player-label{color:var(--playerB);}
  .name-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;padding:10px 12px;outline:none;margin-bottom:10px;transition:border-color 0.2s;}
  .name-input:focus{border-color:var(--accent);}
  .data-textarea{width:100%;height:200px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:10px 12px;outline:none;resize:vertical;line-height:1.6;transition:border-color 0.2s;}
  .data-textarea:focus{border-color:var(--accent);}
  .data-textarea::placeholder{color:var(--text-dim);}
  .btn-generate{width:100%;padding:16px;background:var(--accent);border:none;border-radius:4px;color:white;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;margin-bottom:32px;}
  .btn-generate:hover{background:#c0002f;}
  .result-section{display:none;}
  .result-section.visible{display:block;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text-dim);margin-bottom:16px;border-left:3px solid var(--accent);padding-left:12px;}
  .player-headers{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .player-header-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;text-align:center;}
  .playerA-card{border-top:3px solid var(--playerA);}
  .playerB-card{border-top:3px solid var(--playerB);}
  .ph-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;}
  .playerA-card .ph-name{color:var(--playerA);}
  .playerB-card .ph-name{color:var(--playerB);}
  .ph-sub{font-size:12px;color:var(--text-dim);}
  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:28px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .chart-legend{display:flex;gap:24px;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:13px;}
  .legend-dot{width:12px;height:12px;border-radius:50%;}
  .compare-block{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:20px;}
  .compare-block-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--text-dim);margin-bottom:16px;}
  .stat-compare-row{display:grid;grid-template-columns:1fr 200px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .stat-compare-row:last-child{border-bottom:none;}
  .stat-name{text-align:center;font-size:11px;color:var(--text-dim);letter-spacing:0.5px;}
  .val-higher{color:var(--green);}
  .val-lower{color:var(--text-dim);}
  .val-equal{color:var(--gold);}
  .bar-wrap{display:flex;align-items:center;gap:4px;}
  .bar-A{height:6px;background:var(--playerA);border-radius:3px;transition:width 0.5s;}
  .bar-B{height:6px;background:var(--playerB);border-radius:3px;transition:width 0.5s;}
  .metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .metric-title{font-size:12px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
  .metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .metric-row:last-child{border-bottom:none;}
  .metric-label{font-size:13px;}
  .metric-values{display:flex;gap:16px;}
  .metric-val{font-family:'Bebas Neue',sans-serif;font-size:20px;}
  .metric-val-A{color:var(--playerA);}
  .metric-val-B{color:var(--playerB);}
  .style-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .style-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;}
  .style-card.playerA-card{border-left:3px solid var(--playerA);}
  .style-card.playerB-card{border-left:3px solid var(--playerB);}
  .style-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:6px;}
  .style-type{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:12px;}
  .style-desc{font-size:13px;line-height:1.8;color:var(--text-dim);}
  .style-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .style-tag{font-size:11px;padding:3px 8px;border-radius:2px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:white;padding:12px 20px;border-radius:4px;font-weight:700;font-size:13px;transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:999;}
  .toast.show{transform:translateY(0);opacity:1;}
  .match-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:20px;}
  .match-summary-vs{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--text-dim);margin-bottom:8px;}
  .match-summary-text{font-size:15px;line-height:1.9;color:var(--text);}
  .match-summary-keyword{color:var(--gold);font-weight:700;}
  .individual-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .individual-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .individual-summary-card.playerA-card{border-left:3px solid var(--playerA);}
  .individual-summary-card.playerB-card{border-left:3px solid var(--playerB);}
  .individual-summary-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-bottom:8px;}
  .playerA-card .individual-summary-name{color:var(--playerA);}
  .playerB-card .individual-summary-name{color:var(--playerB);}
  .individual-summary-text{font-size:13px;line-height:1.9;color:var(--text-dim);}
  .cast-script-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:6px;padding:24px;margin-bottom:20px;position:relative;}
  .cast-script-label{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:700;}
  .cast-script-text{font-size:14px;line-height:2;color:var(--text);}
  .cast-script-text em{color:var(--gold);font-style:normal;font-weight:700;}
  .btn-copy{position:absolute;top:16px;right:16px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:4px 10px;border-radius:2px;cursor:pointer;transition:all 0.2s;}
  .btn-copy:hover{border-color:var(--gold);color:var(--gold);}
  .card-download-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .btn-card-dl{width:100%;padding:14px;background:transparent;border:2px solid var(--accent);border-radius:4px;color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;margin-top:12px;display:block;}
  .btn-card-dl:hover{background:var(--accent);color:white;}
  .edit-area{padding:10px 0 0;margin-top:8px;border-top:1px solid var(--border);}
  .edit-row{display:flex;gap:8px;align-items:center;}
  .edit-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:13px;padding:7px 10px;outline:none;transition:border-color 0.2s;}
  .edit-input:focus{border-color:var(--gold);}
  .btn-apply{padding:7px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .btn-apply:hover{border-color:var(--gold);color:var(--gold);}
  @media(max-width:768px){.input-section,.player-headers,.metrics-grid,.style-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="logo">B<span>F</span>TC <span style="font-size:16px;color:var(--text-dim);letter-spacing:1px;">STATS COMPARE</span></div>
</header>
<div class="container">
  <div class="input-section">
    <div class="player-input playerA">
      <div class="player-label">PLAYER A</div>
      <input type="text" class="name-input" id="nameA" placeholder="選手名A">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <select class="name-input" id="rankA" style="margin-bottom:0">
          <option value="">ランク帯（任意）</option>
          <option>ROOKIE</option><option>IRON</option><option>BRONZE</option><option>SILVER</option><option>GOLD</option><option>PLATINUM</option><option>DIAMOND</option><option>MASTER〜1599</option><option>MASTER〜1699</option><option>MASTER〜1799</option><option>MASTER〜1899</option><option>MASTER〜2000</option><option>MASTER2000〜</option><option>LEGEND</option>
        </select>
        <select class="name-input" id="opA" style="margin-bottom:0">
          <option value="">操作タイプ（任意）</option><option>クラシック</option><option>モダン</option>
        </select>
      </div>
      <input type="text" class="name-input" id="charaA" placeholder="使用キャラクター（任意）">
      <textarea class="data-textarea" id="dataA" placeholder="例：&#10;ドライブパリィ 15.27%&#10;ドライブインパクト 3.70%&#10;オーバードライブアーツ 23.57%&#10;パリィドライブラッシュ 6.98%&#10;キャンセルドライブラッシュ 25.61%&#10;ドライブリバーサル 0.67%&#10;ダメージ 24.16%&#10;（CAPCOMのデータをそのまま貼り付けてください）"></textarea>
    </div>
    <div class="player-input playerB">
      <div class="player-label">PLAYER B</div>
      <input type="text" class="name-input" id="nameB" placeholder="選手名B">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <select class="name-input" id="rankB" style="margin-bottom:0">
          <option value="">ランク帯（任意）</option>
          <option>ROOKIE</option><option>IRON</option><option>BRONZE</option><option>SILVER</option><option>GOLD</option><option>PLATINUM</option><option>DIAMOND</option><option>MASTER〜1599</option><option>MASTER〜1699</option><option>MASTER〜1799</option><option>MASTER〜1899</option><option>MASTER〜2000</option><option>MASTER2000〜</option><option>LEGEND</option>
        </select>
        <select class="name-input" id="opB" style="margin-bottom:0">
          <option value="">操作タイプ（任意）</option><option>クラシック</option><option>モダン</option>
        </select>
      </div>
      <input type="text" class="name-input" id="charaB" placeholder="使用キャラクター（任意）">
      <textarea class="data-textarea" id="dataB" placeholder="例：&#10;ドライブパリィ 15.16%&#10;ドライブインパクト 0.93%&#10;（CAPCOMのデータをそのまま貼り付けてください）"></textarea>
    </div>
  </div>
  <button class="btn-generate" onclick="generateCompare()">⚔ 比較を生成する</button>
  <button onclick="clearAll()" style="width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;font-size:13px;cursor:pointer;margin-top:-16px;margin-bottom:32px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">🗑 入力内容をクリア</button>

  <div class="result-section" id="resultSection">
    <div class="player-headers">
      <div class="player-header-card playerA-card"><div class="ph-name" id="rNameA">—</div><div class="ph-sub" id="rSubA"></div></div>
      <div class="player-header-card playerB-card"><div class="ph-name" id="rNameB">—</div><div class="ph-sub" id="rSubB"></div></div>
    </div>
    <div class="section-title">レーダーチャート比較</div>
    <div class="chart-wrap">
      <canvas id="radarChart" width="500" height="500"></canvas>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--playerA)"></div><span id="legendA">Player A</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--playerB)"></div><span id="legendB">Player B</span></div>
      </div>
    </div>
    <div class="section-title">ドライブゲージ使用傾向</div>
    <div class="compare-block" id="driveBlock"></div>
    <div class="section-title">詳細スタッツ比較</div>
    <div id="detailBlocks"></div>
    <div class="section-title">BFTC独自指標<span style="font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--text-dim);letter-spacing:0;margin-left:12px;font-weight:400;">（強さ指標ではなくスタイル指標）</span></div>
    <div class="metrics-grid" id="metricsGrid"></div>
    <div class="section-title">プレイスタイル総評</div>
    <div class="style-grid" id="styleGrid"></div>

    <div class="section-title">二つ名</div>
    <div id="titleGenPanel" style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px;display:none;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--text-dim);margin-bottom:16px;">⚙ 二つ名生成設定</div>
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:10px;">使用する指標</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;" id="titleGenChecks">
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button onclick="setAllTitleChecks(true)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-family:'Noto Sans JP',sans-serif;">全選択</button>
          <button onclick="setAllTitleChecks(false)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-family:'Noto Sans JP',sans-serif;">全解除</button>
        </div>
      </div>
      <button onclick="regenAllTitles()" style="background:var(--accent);border:none;border-radius:4px;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:12px 28px;cursor:pointer;">⚔ この条件で再生成</button>
    </div>
    <div style="margin-bottom:12px;">
      <button onclick="toggleTitleGenPanel()" id="titleGenToggleBtn" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:8px 16px;border-radius:3px;cursor:pointer;transition:all 0.2s;">⚙ 生成設定を開く</button>
    </div>
    <div class="style-grid" id="titleGrid"></div>

    <div class="section-title">マッチアップサマリ</div>
    <div id="matchSummary"></div>
    <div class="section-title">実況スクリプト</div>
    <div id="castScript"></div>
    <div class="section-title">X投稿文</div>
    <div id="xPost"></div>
    <div class="section-title">対戦カード（SNS用画像）</div>
    <div class="card-download-grid">
      <div>
        <canvas id="cardCanvasA" width="1280" height="720" style="width:100%;border:1px solid var(--border);border-radius:4px;background:#0c0c10;"></canvas>
        <button class="btn-card-dl" onclick="downloadCard('A')">⬇ Aのカードをダウンロード</button>
      </div>
      <div>
        <canvas id="cardCanvasB" width="1280" height="720" style="width:100%;border:1px solid var(--border);border-radius:4px;background:#0c0c10;"></canvas>
        <button class="btn-card-dl" onclick="downloadCard('B')">⬇ Bのカードをダウンロード</button>
      </div>
    </div>
    <div class="section-title">OBS用マッチカードURL</div>
    <div id="matchcardUrl"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxPhj1Dhtm-p9gXXd1hJlnO526i7488aK78aNNKiK__d6329QhH2U4fPQFwaaMWED2I/exec';

(function(){
  const checks=[
    ['cdr_high','CDR（前進圧力）'],['od_high','OD技（覚醒）'],['pdr_high','パリィドライブラッシュ'],
    ['wall_high','壁際支配'],['throw_high','投げ攻勢'],['parry_high','パリィ精度'],
    ['just_high','ジャストパリィ'],['di_high','ドライブインパクト'],['ground_control','地上戦'],
    ['pressure','攻撃圧力'],['efficient','ゲージ効率'],['defense','消耗・耐久'],
    ['reversal','リバーサル'],['inverted','変則・逆張り'],['default','読み合い・汎用']
  ];
  const el=document.getElementById('titleGenChecks');
  if(el) el.innerHTML=checks.map(([k,l])=>`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-dim);padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;"><input type="checkbox" class="title-gen-check" value="${k}" checked style="accent-color:var(--accent);">${l}</label>`).join('');
})();

function clearAll(){
  ['nameA','nameB','charaA','charaB'].forEach(id=>document.getElementById(id).value='');
  ['rankA','rankB','opA','opB'].forEach(id=>document.getElementById(id).value='');
  ['dataA','dataB'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('resultSection').classList.remove('visible');
  usedTitles.clear();
  window._titleData=null;
  showToast('✓ クリアしました');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function parseData(text){
  const d={};
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  const merged=[];
  for(let i=0;i<lines.length;i++){
    const cur=lines[i],next=lines[i+1]||'';
    if(/^[\d.,]+(%|回|秒|PT)?$/.test(cur))continue;
    if(next&&/^[\d.,]+(%|回|秒|PT)?$/.test(next))merged.push(cur+' '+next);
    else merged.push(cur);
  }
  const fullText=lines.join('\n')+'\n'+merged.join('\n');
  const patterns=[
    {key:'dp',regex:/ドライブパリィ\s*([\d.]+)%/},{key:'di',regex:/ドライブインパクト\s*([\d.]+)%/},
    {key:'od',regex:/オーバードライブアーツ\s*([\d.]+)%/},{key:'pdr',regex:/パリィドライブラッシュ\s*([\d.]+)%/},
    {key:'cdr',regex:/キャンセルドライブラッシュ\s*([\d.]+)%/},{key:'dr',regex:/ドライブリバーサル\s*([\d.]+)%/},
    {key:'dmg',regex:/ダメージ\s*([\d.]+)%/},{key:'dpSuc',regex:/成功回数\s*([\d.]+)回/},
    {key:'justParry',regex:/ジャストパリィ回数\s*([\d.]+)回/},{key:'diPC',regex:/パニッシュカウンターを決めた回数\s*([\d.]+)回/},
    {key:'diRecvPC',regex:/パニッシュカウンターを受けた回数\s*([\d.]+)回/},
    {key:'sa1',regex:/Lv1\s*([\d.]+)%/},{key:'sa2',regex:/Lv2\s*([\d.]+)%/},
    {key:'sa3',regex:/Lv3\s*([\d.]+)%/},{key:'ca',regex:/CA\s*([\d.]+)%/},
    {key:'throwEsc',regex:/投げ抜け回数\s*([\d.]+)回/},
    {key:'wallAtk',regex:/相手を追い詰めている時間\s*([\d.]+)秒/},
    {key:'wallDef',regex:/相手に追い詰められている時間\s*([\d.]+)秒/},
    {key:'rankMatch',regex:/ランクマッチプレイ回数\s*([\d,]+)回/},
    {key:'casual',regex:/カジュアルマッチプレイ回数\s*([\d,]+)回/},
    {key:'room',regex:/ルームマッチプレイ回数\s*([\d,]+)回/},
    {key:'hub',regex:/バトルハブマッチプレイ回数\s*([\d,]+)回/},
    {key:'pts',regex:/累計プレイポイント\s*([\d,]+)PT/},
    {key:'challenge',regex:/チャレンジクリア回数\s*([\d,]+)回/},
  ];
  patterns.forEach(p=>{const m=fullText.match(p.regex);if(m)d[p.key]=parseFloat(m[1].replace(/,/g,''));});
  const diHitMatches=fullText.match(/決めた回数\s*([\d.]+)回/g);
  if(diHitMatches&&diHitMatches.length>=1){d.diHit=parseFloat(diHitMatches[0].match(/([\d.]+)/)[0]);d.throwGive=diHitMatches.length>=2?parseFloat(diHitMatches[diHitMatches.length-1].match(/([\d.]+)/)[0]):0;}
  const recvMatches=fullText.match(/受けた回数\s*([\d.]+)回/g);
  if(recvMatches&&recvMatches.length>=1){d.diRecv=parseFloat(recvMatches[0].match(/([\d.]+)/)[0]);d.throwRecv=recvMatches.length>=2?parseFloat(recvMatches[recvMatches.length-1].match(/([\d.]+)/)[0]):0;}
  const stunGiveM=fullText.match(/スタンさせた回数\s*([\d.]+)回/);if(stunGiveM)d.stunGive=parseFloat(stunGiveM[1]);
  const stunRecvM=fullText.match(/スタンさせられた回数\s*([\d.]+)回/);if(stunRecvM)d.stunRecv=parseFloat(stunRecvM[1]);
  return d;
}

function calcMetrics(d){
  const attackIdx=Math.min(100,Math.round(((d.cdr||0)+(d.od||0)+(d.pdr||0))*0.95));
  const defenseIdx=Math.min(100,Math.round(((d.dr||0)+(d.dmg||0))*1.8));
  const wallCtrl=d.wallAtk&&d.wallDef?Math.round((d.wallAtk/(d.wallAtk+d.wallDef))*100):0;
  const throwRatio=d.throwGive&&d.throwRecv?Math.round((d.throwGive/(d.throwGive+d.throwRecv))*100):0;
  const saHigh=Math.max(d.sa2||0,d.sa3||0);
  return{attackIdx,defenseIdx,wallCtrl,throwRatio,saHigh};
}

function getPlayStyle(d,m){
  const tags=[],styles=[],wc=m.wallCtrl||0,tr=m.throwRatio||0;
  if(d.cdr>=40&&d.od>=25){tags.push('超攻撃特化型');styles.push('キャンセルドライブラッシュとOD技を軸に、ゲージを惜しみなく攻撃に注ぎ込む超攻撃特化スタイル');}
  else if(d.cdr>=35&&wc>=55){tags.push('壁詰め殲滅型');styles.push('キャンセルドライブラッシュで一気に距離を詰め、壁際に追い込んでから崩す前進コーナー攻略型');}
  else if(d.cdr>=35&&d.throwGive>=2.5){tags.push('接近投げ崩し型');styles.push('キャンセルドライブラッシュで間合いを詰めて投げを絡める、起き攻め・投げ崩しが得意なスタイル');}
  else if(d.cdr>=30&&d.pdr>=8){tags.push('変則ドライブラッシュ型');styles.push('キャンセルドライブラッシュとパリィドライブラッシュを使い分ける高度なドライブゲージ活用型');}
  else if(d.od>=30&&d.sa3>=30){tags.push('大技連打型');styles.push('OD技と高レベルSAを軸に、要所で大ダメージを狙う決め手重視の大技連打スタイル');}
  else if(d.od>=28){tags.push('OD多用型');styles.push('オーバードライブ技の使用率が突出して高く、ゲージをダメージに直結させる覚醒主義スタイル');}
  else if(d.pdr>=12&&d.dpSuc>=2){tags.push('パリィ攻め型');styles.push('パリィドライブラッシュとパリィ成功を攻撃の起点にする、読み合い重視の攻撃的カウンタースタイル');}
  else if(d.dpSuc>=3&&d.justParry>=1){tags.push('神域パリィ型');styles.push('通常パリィ・ジャストパリィの精度が異常に高い、相手の攻撃を見切ることを軸にした玄人スタイル');}
  else if(d.dpSuc>=2.5){tags.push('堅守反撃型');styles.push('パリィ精度が高く、相手の攻撃を受け流してから反撃する守備的カウンタースタイル');}
  else if(d.throwGive>=3.5&&wc>=55){tags.push('投げコーナー支配型');styles.push('投げを多用して相手をコーナーに追い込み、壁際の攻防で圧倒するグラップラースタイル');}
  else if(d.throwGive>=3){tags.push('投げ崩し特化型');styles.push('投げ命中率が際立って高く、打撃と投げの2択を武器に崩しを得意とするグラップラースタイル');}
  else if(wc>=65){tags.push('壁際絶対王者型');styles.push('壁際支配率が圧倒的に高く、一度コーナーに追い込んだら逃さない。コーナーこそが本領のスタイル');}
  else if(wc>=55){tags.push('コーナー主導型');styles.push('壁際での攻防を得意とし、相手をコーナーに追い込んでからの崩しで試合を組み立てるスタイル');}
  else if(d.sa3>=45){tags.push('SA3全振り型');styles.push('SAゲージのLv3集中率が極めて高い。必殺技一発に試合の流れを賭ける豪快な大技主義スタイル');}
  else if(d.sa2>=50){tags.push('SA2連打型');styles.push('SAゲージをLv2で使い続けるコスト効率重視スタイル。隙を見逃さず素早くSAを叩き込む');}
  else if(d.dr>=2){tags.push('リバーサル依存型');styles.push('ドライブリバーサルの使用率が高い。守りに入った場面での切り返しを得意とする防御反撃スタイル');}
  else if(m.defenseIdx>=60&&m.attackIdx<=40){tags.push('受け師型');styles.push('ゲージ消耗が多く守備に回る展開が多い。耐えながら相手のミスを誘うじっくり型スタイル');}
  else if(m.attackIdx>=60){tags.push('積極攻撃型');styles.push('ゲージを攻撃リソースとして効率よく使う積極攻撃スタイル。前に出て主導権を握ることを好む');}
  else if(m.attackIdx>=45&&m.defenseIdx<=35){tags.push('効率攻撃型');styles.push('ゲージ消耗が少なく攻撃に使えるゲージを常に確保しているタイプ。無駄のない立ち回りが特徴');}
  else if(d.pdr>=8){tags.push('パリィドライブラッシュ型');styles.push('パリィドライブラッシュを積極的に使う読み合い重視スタイル。相手の行動を読んで攻めに転じる');}
  else if(d.rankMatch>=40000){tags.push('歴戦の猛者型');styles.push('圧倒的な対戦経験値に裏打ちされた安定感が武器。試合の流れを読む能力に長けたベテランスタイル');}
  else{tags.push('総合バランス型');styles.push('特定の武器に偏らず、状況に応じてゲージの使い方を柔軟に変えるオールラウンドなバランス型');}
  if(d.justParry>=1&&!tags.includes('神域パリィ型'))tags.push('ジャストパリィ使い');
  if(d.cdr>=30&&!tags[0].includes('ドライブラッシュ'))tags.push('ドライブラッシュ活用');
  if(d.dmg>=28)tags.push('ゲージ消耗注意');
  if(d.rankMatch>=30000&&!tags.includes('歴戦の猛者型'))tags.push('ベテラン');
  return{type:tags[0],desc:styles[0]+'。',tags};
}

function drawRadar(dA,dB,nameA,nameB){
  const canvas=document.getElementById('radarChart');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=180;
  ctx.clearRect(0,0,W,H);
  const axes=[
    {label:'攻撃圧力',valA:Math.min(100,((dA.cdr||0)+(dA.od||0)+(dA.pdr||0))*0.95),valB:Math.min(100,((dB.cdr||0)+(dB.od||0)+(dB.pdr||0))*0.95)},
    {label:'守備消耗',valA:Math.min(100,((dA.dr||0)+(dA.dmg||0))*1.8),valB:Math.min(100,((dB.dr||0)+(dB.dmg||0))*1.8)},
    {label:'壁際支配',valA:dA.wallAtk&&dA.wallDef?(dA.wallAtk/(dA.wallAtk+dA.wallDef))*100:50,valB:dB.wallAtk&&dB.wallDef?(dB.wallAtk/(dB.wallAtk+dB.wallDef))*100:50},
    {label:'投げ攻め',valA:dA.throwGive&&dA.throwRecv?(dA.throwGive/(dA.throwGive+dA.throwRecv))*100:50,valB:dB.throwGive&&dB.throwRecv?(dB.throwGive/(dB.throwGive+dB.throwRecv))*100:50},
    {label:'パリィ力',valA:Math.min(100,(dA.dpSuc||0)*20+(dA.justParry||0)*15),valB:Math.min(100,(dB.dpSuc||0)*20+(dB.justParry||0)*15)},
    {label:'SA活用',valA:Math.max(dA.sa2||0,dA.sa3||0),valB:Math.max(dB.sa2||0,dB.sa3||0)},
  ];
  const n=axes.length,step=(Math.PI*2)/n;
  for(let lv=1;lv<=5;lv++){
    ctx.beginPath();
    for(let i=0;i<n;i++){const a=-Math.PI/2+step*i;i===0?ctx.moveTo(cx+r*lv/5*Math.cos(a),cy+r*lv/5*Math.sin(a)):ctx.lineTo(cx+r*lv/5*Math.cos(a),cy+r*lv/5*Math.sin(a));}
    ctx.closePath();ctx.strokeStyle='#2a2a3a';ctx.lineWidth=1;ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+step*i;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='#2a2a3a';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#7a7a9a';ctx.font='bold 12px Noto Sans JP';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(axes[i].label,cx+(r+28)*Math.cos(a),cy+(r+28)*Math.sin(a));
  }
  [{vals:axes.map(a=>a.valA),color:'#e8003d'},{vals:axes.map(a=>a.valB),color:'#0099ff'}].forEach(({vals,color})=>{
    ctx.beginPath();
    vals.forEach((v,i)=>{const a=-Math.PI/2+step*i,rr=r*Math.min(v,100)/100;i===0?ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));});
    ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle=color+'4d';ctx.fill();
  });
}

function makeCompareRow(label,valA,valB,unitA='',unitB=''){
  const a=parseFloat(valA)||0,b=parseFloat(valB)||0,max=Math.max(a,b,0.001);
  const wA=Math.round((a/max)*100),wB=Math.round((b/max)*100);
  const clsA=a>b?'val-higher':a<b?'val-lower':'val-equal';
  const clsB=b>a?'val-higher':b<a?'val-lower':'val-equal';
  return `<div class="stat-compare-row"><div style="text-align:right"><div class="${clsA}" style="font-weight:700;font-size:15px">${valA}${unitA}</div><div class="bar-wrap" style="justify-content:flex-end"><div class="bar-A" style="width:${wA}px;max-width:120px"></div></div></div><div class="stat-name">${label}</div><div><div class="${clsB}" style="font-weight:700;font-size:15px">${valB}${unitB}</div><div class="bar-wrap"><div class="bar-B" style="width:${wB}px;max-width:120px"></div></div></div></div>`;
}

function generateIndividualSummary(name,d,m,s,wallCtrl,throwRatio){
  const lines=[];
  lines.push(`過去100戦平均のバトルの傾向によると、キャンセルドライブラッシュ${d.cdr||0}%・OD技${d.od||0}%・パリィドライブラッシュ${d.pdr||0}%と、ゲージの攻撃活用率は<strong>${m.attackIdx}/100</strong>。`);
  lines.push(wallCtrl>=55?`壁際支配率${wallCtrl}%と高く、コーナーでの崩しを得意とする。`:wallCtrl<=45?`壁際支配率${wallCtrl}%と低め。追い詰められる場面が多い傾向がある。`:`壁際の攻防は${wallCtrl}%とほぼ互角の展開が多い。`);
  lines.push(throwRatio>=55?`投げ攻勢率${throwRatio}%と投げを積極的に活用する崩し型。`:`投げ攻勢率${throwRatio}%。投げよりも技での崩しを好むスタイル。`);
  lines.push(`守備消耗度${m.defenseIdx}/100（リバーサル${d.dr||0}%・ダメージ消費${d.dmg||0}%から算出）。${m.defenseIdx>=50?'ガードによるゲージ消耗が課題となる場面も。':'ゲージをしっかり攻撃に回せている。'}パニッシュカウンター被弾${d.diRecvPC||0}回も参考値。`);

function joinTitleParts(f,b){
  if(!b||b==='（後半なし）')return f;
  const isAlphaF=/[a-zA-Z0-9]$/.test(f);
  const isAlphaB=/^[a-zA-Z]/.test(b);
  const bHasParticle=/^(の|で|が|は|を|に|と)/.test(b);
  if(bHasParticle)return f+b;
  if(isAlphaF&&isAlphaB)return f+' '+b;
  if(isAlphaF&&!isAlphaB)return f+b;
  if(!isAlphaF&&isAlphaB)return f+' '+b;
  const noParticle=['零コンマ','1F','刹那','HP1','止まったら死ぬ','削られるほど本気','傷だらけ','崖っぷち','絶体絶命','地面しか見ない'];
  if(noParticle.some(n=>f===n))return f+b;
  return f+'の'+b;
}

function buildCategoryPools(d,m,wallCtrl,throwRatio){
  const pools=[];
  if(d.cdr>=30)pools.push({key:'cdr_high',pool:TITLE_POOL.cdr_high});
  if(d.od>=22)pools.push({key:'od_high',pool:TITLE_POOL.od_high});
  if(d.pdr>=8)pools.push({key:'pdr_high',pool:TITLE_POOL.pdr_high});
  if(wallCtrl>=55)pools.push({key:'wall_high',pool:TITLE_POOL.wall_high});
  if(throwRatio>=55)pools.push({key:'throw_high',pool:TITLE_POOL.throw_high});
  if(d.dpSuc>=2)pools.push({key:'parry_high',pool:TITLE_POOL.parry_high});
  if(d.justParry>=1)pools.push({key:'just_high',pool:TITLE_POOL.just_high});
  if(d.di>=2.5)pools.push({key:'di_high',pool:TITLE_POOL.di_high});
  if(d.dr>=1.5)pools.push({key:'reversal',pool:TITLE_POOL.reversal});
  if(m.defenseIdx<=30)pools.push({key:'efficient',pool:TITLE_POOL.efficient});
  if(m.defenseIdx>=55)pools.push({key:'defense',pool:TITLE_POOL.defense});
  if(wallCtrl<=45)pools.push({key:'ground_control',pool:TITLE_POOL.ground_control});
  if(m.attackIdx>=60)pools.push({key:'pressure',pool:TITLE_POOL.pressure});
  pools.push({key:'default',pool:TITLE_POOL.default});
  return pools;
}

function generateTitle(name,d,m,sStyle,wallCtrl,throwRatio){
  const categoryPools=buildCategoryPools(d,m,wallCtrl,throwRatio);
  const invertedPool={key:'inverted',pool:TITLE_POOL.inverted};
  const useInvertedForFirst=Math.random()<0.5;
  const poolsForT1=useInvertedForFirst?[...categoryPools,invertedPool]:categoryPools;
  const poolsForT2=useInvertedForFirst?categoryPools:[...categoryPools,invertedPool];
  const shuffled1=[...poolsForT1].sort(()=>Math.random()-0.5);
  let t1=null,t1Cat=null;
  for(const cat of shuffled1){
    const avail=cat.pool.filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t));
    if(avail.length>0){t1=avail[Math.floor(Math.random()*avail.length)];t1Cat=cat.key;break;}
  }
  t1=t1||TITLE_POOL.default[0];t1Cat=t1Cat||'default';
  usedTitles.add(t1);
  const shuffled2=[...poolsForT2].filter(c=>c.key!==t1Cat).sort(()=>Math.random()-0.5);
  let t2=null,t2Cat=null;
  for(const cat of shuffled2){
    const avail=cat.pool.filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&t!==t1);
    if(avail.length>0){t2=avail[Math.floor(Math.random()*avail.length)];t2Cat=cat.key;break;}
  }
  if(!t2){const all=categoryPools.flatMap(c=>c.pool).filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&t!==t1);t2=all.length>0?all[Math.floor(Math.random()*all.length)]:TITLE_POOL.default[1];t2Cat='default';}
  usedTitles.add(t2);
  const shuffled3=[...categoryPools].filter(c=>c.key!==t1Cat&&c.key!==t2Cat&&c.key!=='inverted').sort(()=>Math.random()-0.5);
  let t3=null,t3Cat=null;
  for(const cat of shuffled3){
    const avail=cat.pool.filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&t!==t1&&t!==t2);
    if(avail.length>0){t3=avail[Math.floor(Math.random()*avail.length)];t3Cat=cat.key;break;}
  }
  if(!t3){const all=categoryPools.flatMap(c=>c.pool).filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&t!==t1&&t!==t2);t3=all.length>0?all[Math.floor(Math.random()*all.length)]:TITLE_POOL.default[2];t3Cat='default';}
  usedTitles.add(t3);
  return[t1,t2,t3,t1Cat,t2Cat,t3Cat];
}

function generateStyleReason(d,m,s,wallCtrl,throwRatio){
  const type=s.type,parts=[];
  if(type.includes('超攻撃')||type.includes('積極攻撃')||type.includes('OD')||type.includes('大技'))parts.push(`攻撃圧力指数${m.attackIdx}/100（CDR${d.cdr||0}%・OD技${d.od||0}%・PDR${d.pdr||0}%）`);
  if(type.includes('壁際')||type.includes('コーナー')||type.includes('壁詰め'))parts.push(`壁際支配率${wallCtrl}%（追い詰め${d.wallAtk||0}秒 vs 追い詰められ${d.wallDef||0}秒）`);
  if(type.includes('投げ'))parts.push(`投げ命中${d.throwGive||0}回・投げ攻勢率${throwRatio}%`);
  if(type.includes('パリィ'))parts.push(`パリィ成功${d.dpSuc||0}回・ジャストパリィ${d.justParry||0}回`);
  if(type.includes('SA3'))parts.push(`SA Lv3使用率${d.sa3||0}%`);
  if(type.includes('SA2'))parts.push(`SA Lv2使用率${d.sa2||0}%`);
  if(type.includes('守備')||type.includes('受け師')||type.includes('リバーサル'))parts.push(`守備消耗度${m.defenseIdx}/100・ダメージ消費${d.dmg||0}%`);
  if(parts.length===0)parts.push(`攻撃圧力指数${m.attackIdx}/100・守備消耗度${m.defenseIdx}/100・壁際支配率${wallCtrl}%の総合判定`);
  return '判定根拠：'+parts.join('、')+'。';
}

  switch(category){
    case 'cdr_high':return `CDR${d.cdr||0}%・OD技${d.od||0}%・攻撃圧力指数${m.attackIdx}/100。ゲージを前進と攻撃に使い続ける積極スタイルがデータに表れているため。`;
    case 'od_high':return `OD技${d.od||0}%・CDR${d.cdr||0}%・攻撃圧力指数${m.attackIdx}/100。ゲージを覚醒技に集中させ、要所で爆発させるスタイルが数字に表れているため。`;
    case 'pdr_high':return `パリィDR${d.pdr||0}%・パリィ成功${d.dpSuc||0}回・CDR${d.cdr||0}%。弾いた瞬間を攻めの起点にする攻守一体のスタイルがデータに表れているため。`;
    case 'wall_high':return `壁際追い詰め${d.wallAtk||0}秒・追い詰められ${d.wallDef||0}秒・壁際支配率${wallCtrl}%。コーナーに閉じ込めて離さないスタイルが数字に表れているため。`;
    case 'throw_high':return `投げ命中${d.throwGive||0}回・投げ攻勢率${throwRatio}%・被弾${d.throwRecv||0}回。投げを主軸に崩すスタイルが数字から読み取れるため。`;
    case 'parry_high':return `パリィ成功${d.dpSuc||0}回・ジャストパリィ${d.justParry||0}回・DP使用率${d.dp||0}%。パリィで場を支配するスタイルが数字に表れているため。`;
    case 'just_high':return `ジャストパリィ${d.justParry||0}回・パリィ成功${d.dpSuc||0}回。反応精度が突出して高い証拠。この精度からこの二つ名に。`;
    case 'di_high':return `DI命中${d.diHit||0}回・被弾${d.diRecv||0}回。DIを積極的に仕掛けて試合を動かすスタイルがデータに表れているため。`;
    case 'reversal':return `リバーサル使用率${d.dr||0}%・ダメージ消費${d.dmg||0}%。守りから一瞬で逆転するスタイルがデータに表れているため。`;
    case 'efficient':return `ダメージ消費${d.dmg||0}%・守備消耗度${m.defenseIdx}/100。ゲージを守備で削られず攻撃に回せている効率的な立ち回りがデータに表れているため。`;
    case 'defense':return `ダメージ消費${d.dmg||0}%・リバーサル${d.dr||0}%・守備消耗度${m.defenseIdx}/100。消耗戦を得意とするスタイルからこの二つ名に。`;
    case 'ground_control':return `壁際支配率${wallCtrl}%。中距離・地上戦での攻防が主体で、差し合いの精度がデータに表れているため。`;
    case 'pressure':return `攻撃圧力指数${m.attackIdx}/100・CDR${d.cdr||0}%・OD技${d.od||0}%。ゲージを攻撃に集中させる高い圧力がデータに表れているため。`;
    default:{
      const indicators=[
        {val:d.cdr||0,label:`CDR${d.cdr||0}%`,threshold:25},
        {val:d.od||0,label:`OD技${d.od||0}%`,threshold:20},
        {val:wallCtrl,label:`壁際支配率${wallCtrl}%`,threshold:50},
        {val:throwRatio,label:`投げ攻勢率${throwRatio}%`,threshold:50},
        {val:d.dpSuc||0,label:`パリィ成功${d.dpSuc||0}回`,threshold:2},
      ].filter(i=>i.val>=i.threshold).sort((a,b)=>b.val-a.val);
      if(indicators.length>=2)return `${indicators[0].label}・${indicators[1].label}が突出。これらを軸としたスタイルからこの二つ名に。`;
      if(indicators.length===1)return `${indicators[0].label}が最も突出した特徴。このスタイルからこの二つ名に。`;
      return `CDR${d.cdr||0}%・OD技${d.od||0}%・壁際支配率${wallCtrl}%・投げ攻勢率${throwRatio}%を総合的に分析してこの二つ名に。`;
    }
  }
}

function generateMatchSummary(nameA,nameB,dA,dB,mA,mB,sA,sB,wallCtrlA,wallCtrlB){
  const lines=[],atkDiff=mA.attackIdx-mB.attackIdx,wallDiff=wallCtrlA-wallCtrlB;
  lines.push(`過去100戦平均のバトルの傾向によると、<span class="match-summary-keyword">${nameA}</span>と<span class="match-summary-keyword">${nameB}</span>のマッチアップは、`);
  if(Math.abs(atkDiff)>=15){const at=atkDiff>0?nameA:nameB,def=atkDiff>0?nameB:nameA;lines.push(`攻撃圧力では${at}が優位（${Math.max(mA.attackIdx,mB.attackIdx)} vs ${Math.min(mA.attackIdx,mB.attackIdx)}）。${def}がいかにゲージを守りながら反撃の機会を作れるかが鍵。`);}
  else lines.push(`攻撃圧力は両者ほぼ拮抗（${mA.attackIdx} vs ${mB.attackIdx}）。読み合いの精度が勝敗を分けるカード。`);
  if(Math.abs(wallDiff)>=10){const ww=wallDiff>0?nameA:nameB;lines.push(`壁際支配ではデータ上${ww}が有利。コーナーの攻防がハイライトになる可能性が高い。`);}
  if(sA.type!==sB.type)lines.push(`スタイルの異なる「${sA.type}」vs「${sB.type}」の好カード。`);
  return lines.join('');
}

function generateCastScript(nameA,nameB,dA,dB,mA,mB,sA,sB,wallCtrlA,wallCtrlB,throwRatioA,throwRatioB,rankA,rankB,charaA,charaB,opA,opB,titlesA,titlesB){
  const keyA=sA.tags[0]||'アグレッシブ',keyB=sB.tags[0]||'バランス型';
  const infoA=[rankA,charaA,opA].filter(Boolean).join('・');
  const infoB=[rankB,charaB,opB].filter(Boolean).join('・');
  const titleA=titlesA?titlesA[0]:sA.type,titleB=titlesB?titlesB[0]:sB.type;
  const keyPoints=[];
  const wallDiff=Math.abs(wallCtrlA-wallCtrlB),throwMax=Math.max(throwRatioA,throwRatioB);
  const wallWinnerName=wallCtrlA>=wallCtrlB?nameA:nameB,wallVal=Math.max(wallCtrlA,wallCtrlB);
  const odMax=Math.max(dA.od||0,dB.od||0),odWinner=(dA.od||0)>=(dB.od||0)?nameA:nameB;
  const cdrMax=Math.max(dA.cdr||0,dB.cdr||0),cdrWinner=(dA.cdr||0)>=(dB.cdr||0)?nameA:nameB;
  const parryMax=Math.max(dA.dpSuc||0,dB.dpSuc||0),parryWinner=(dA.dpSuc||0)>=(dB.dpSuc||0)?nameA:nameB;
  const sa3Max=Math.max(dA.sa3||0,dB.sa3||0),sa3Winner=(dA.sa3||0)>=(dB.sa3||0)?nameA:nameB;
  const throwWinnerName=throwRatioA>=throwRatioB?nameA:nameB;
  if(wallDiff>=10&&(dA.wallAtk||0)>(dA.wallDef||0)&&(dB.wallAtk||0)>(dB.wallDef||0))keyPoints.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wallWinnerName}の壁際支配率は${wallVal}%。コーナーに追い込んだ後の崩しパターンに注目してください。`);
  else if((dA.wallDef||0)>(dA.wallAtk||0)&&(dB.wallDef||0)>(dB.wallAtk||0))keyPoints.push(`両者ともに壁を背負う時間が長いデータが出ています。<em>地上戦・中距離の攻防</em>がこの試合の主戦場になりそうです。`);
  if(throwMax>=55)keyPoints.push(`<em>投げの読み合い</em>も見逃せません。${throwWinnerName}の投げ攻勢率${throwMax}%と、接近戦での投げ択が試合の流れを左右しそうです。`);
  if(odMax>=28)keyPoints.push(`<em>OD技の使いどころ</em>がこの試合の分岐点になりそうです。${odWinner}のOD技使用率${odMax}%。ゲージが残っている場面での強行動に注目。`);
  if(cdrMax>=35)keyPoints.push(`<em>ドライブラッシュへの対応</em>が鍵を握ります。${cdrWinner}のキャンセルDR${cdrMax}%は高水準。間合い管理と迎撃タイミングが勝負の分かれ目。`);
  if(parryMax>=2.5)keyPoints.push(`<em>パリィの読み合い</em>にも注目です。${parryWinner}のパリィ成功${parryMax}回は高水準。単調な連携は危険です。`);
  if(sa3Max>=40)keyPoints.push(`<em>必殺技のタイミング</em>も見どころです。${sa3Winner}のSA3使用率${sa3Max}%。大技を溜めている状況での読み合いがクライマックスになりそうです。`);
  if(keyPoints.length===0)keyPoints.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wallWinnerName}の壁際支配率${wallVal}%。コーナーでの攻防に注目してください。`);
  const selectedPoints=keyPoints.slice(0,2).join('<br>');
  return `さあ始まりました！本日の注目カードは<em>${nameA}</em> vs <em>${nameB}</em>！<br><br>今回の対戦カードは<em>『${titleA}』${nameA}</em>と<em>『${titleB}』${nameB}</em>です。<br><br>${infoA?`${nameA}は<em>${infoA}</em>。`:''}過去100戦平均のバトルの傾向によると、${nameA}のプレイスタイルは<em>${keyA}</em>型。キャンセルドライブラッシュ${dA.cdr||0}%、OD技${dA.od||0}%と、ゲージを攻撃に集中させる前線圧力型プレイヤーです。<br><br>${infoB?`対する${nameB}は<em>${infoB}</em>。`:`対する${nameB}は`}<em>${keyB}</em>型。${(dB.throwGive||0)>3?`投げ命中${dB.throwGive||0}回と投げを絡めた崩しが武器。`:`パリィドライブラッシュ${dB.pdr||0}%とゲージの使い分けが巧みなプレイヤー。`}<br><br>${selectedPoints}<br><br>それでは、試合開始です！<br><br><span style="font-size:12px;color:var(--text-dim);border-top:1px solid var(--border);display:block;padding-top:12px;margin-top:8px;">📌 二つ名候補（${nameA}）：『${titlesA[0]}』／『${titlesA[1]}』／『${titlesA[2]}』<br>📌 二つ名候補（${nameB}）：『${titlesB[0]}』／『${titlesB[1]}』／『${titlesB[2]}』</span>`;
}

function generateXPost(nameA,nameB,titleA,titleB,charaA,charaB){
  const clA=charaA?`(${charaA})`:'',clB=charaB?`(${charaB})`:'';
  const text=`⚔️ 対戦カード紹介\n\n『${titleA}』${nameA}${clA}\n\nvs\n\n『${titleB}』${nameB}${clB}\n\n📺 twitch.tv/bridgeftc\n#BridgeFTC #対戦カード`;
  return text.length<=140?text:text.slice(0,137)+'...';
}

function updateXPost(){
  if(!window._titleData)return;
  const x=window._titleData;
  const tA=x.titlesA[x.selectedA],tB=x.titlesB[x.selectedB];
  const text=generateXPost(x.nameA,x.nameB,tA,tB,x.charaA,x.charaB);
  const el=document.getElementById('xPostText'),cnt=document.getElementById('xCharCount');
  if(el)el.innerText=text;if(cnt)cnt.textContent=text.length+'文字';
}

function copyXPost(){const el=document.getElementById('xPostText');navigator.clipboard.writeText(el.innerText).then(()=>showToast('✓ X投稿文をコピーしました'));}
function copyScript(){const el=document.getElementById('castScriptText');navigator.clipboard.writeText(el.innerText).then(()=>showToast('✓ スクリプトをコピーしました'));}

function drawPlayerCard(canvasId,playerName,chara,title,styleType,radarVals,radarLabels){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=1280,H=720,BOTTOM=56,MAIN_H=H-BOTTOM,LEFT_W=W/2;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0c0c10';ctx.fillRect(0,0,W,H);
  const glowL=ctx.createRadialGradient(LEFT_W*0.4,MAIN_H/2,0,LEFT_W*0.4,MAIN_H/2,LEFT_W*0.8);
  glowL.addColorStop(0,'rgba(120,0,0,0.10)');glowL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glowL;ctx.fillRect(0,0,W,MAIN_H);
  ctx.strokeStyle='rgba(255,255,255,0.018)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MAIN_H);ctx.stroke();}
  for(let y=0;y<MAIN_H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const dg=ctx.createLinearGradient(LEFT_W,0,LEFT_W,MAIN_H);
  dg.addColorStop(0,'rgba(180,0,0,0)');dg.addColorStop(0.2,'#c00');dg.addColorStop(0.8,'#c00');dg.addColorStop(1,'rgba(180,0,0,0)');
  ctx.strokeStyle=dg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(LEFT_W,0);ctx.lineTo(LEFT_W,MAIN_H);ctx.stroke();
  const dc=(x,y,dx,dy)=>{ctx.strokeStyle='#cc0000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+dx*20,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*20);ctx.stroke();};
  dc(12,12,1,1);dc(W-12,12,-1,1);dc(12,MAIN_H-12,1,-1);dc(W-12,MAIN_H-12,-1,-1);
  ctx.save();ctx.beginPath();ctx.rect(0,0,LEFT_W,MAIN_H);ctx.clip();
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 42px "Noto Sans JP",sans-serif';ctx.fillText(playerName,LEFT_W/2,80);
  ctx.fillStyle='#cc0000';ctx.font='bold 12px sans-serif';ctx.fillText('PLAYER',LEFT_W/2,102);
  const cx=LEFT_W/2,cy=390,r=200,n=6,as=(Math.PI*2)/n,sa=-Math.PI/2;
  const hp=(rad,i)=>{const a=sa+as*i;return{x:cx+rad*Math.cos(a),y:cy+rad*Math.sin(a)};};
  [1,0.67,0.33].forEach(ratio=>{
    ctx.beginPath();
    for(let i=0;i<n;i++){const p=hp(r*ratio,i);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
    ctx.closePath();ctx.strokeStyle='rgba(180,0,0,0.18)';ctx.lineWidth=1;ctx.stroke();
  });
  for(let i=0;i<n;i++){const p=hp(r,i);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.strokeStyle='rgba(180,0,0,0.15)';ctx.lineWidth=0.8;ctx.stroke();}
  ctx.beginPath();
  radarVals.forEach((v,i)=>{const p=hp(r*Math.min(v,100)/100,i);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
  ctx.closePath();ctx.fillStyle='rgba(180,0,0,0.22)';ctx.fill();ctx.strokeStyle='#cc0000';ctx.lineWidth=1.5;ctx.stroke();
  radarVals.forEach((v,i)=>{const p=hp(r*Math.min(v,100)/100,i);ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#cc0000';ctx.fill();});
  ctx.fillStyle='#888';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  radarLabels.forEach((label,i)=>{const p=hp(r+30,i);ctx.fillText(label,p.x,p.y+5);});
  ctx.restore();ctx.save();ctx.beginPath();ctx.rect(LEFT_W,0,LEFT_W,MAIN_H);ctx.clip();
  const RX=LEFT_W+60;
  ctx.fillStyle='#cc0000';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText('二つ名',RX,120);
  ctx.fillStyle='#cc0000';ctx.fillRect(RX,132,4,48);
  ctx.fillStyle='#ffffff';ctx.font='bold 30px "Noto Sans JP",sans-serif';ctx.fillText(title,RX+16,166);
  ctx.fillStyle='#cc0000';ctx.font='bold 13px sans-serif';ctx.fillText('プレイスタイル',RX,234);
  ctx.fillStyle='#e0e0e0';ctx.font='bold 20px "Noto Sans JP",sans-serif';ctx.fillText(styleType,RX,270);
  ctx.fillStyle='#cc0000';ctx.font='bold 13px sans-serif';ctx.fillText('使用キャラ',RX,380);
  ctx.fillStyle='#bbbbbb';ctx.font='bold 26px "Noto Sans JP",sans-serif';ctx.fillText(chara||'CHARACTER',RX,412);
  ctx.fillStyle='#ffffff';ctx.font='bold 36px sans-serif';ctx.fillText('#BridgeFTC',RX,510);
  ctx.restore();
  ctx.fillStyle='#0a0000';ctx.fillRect(0,MAIN_H,W,BOTTOM);
  ctx.strokeStyle='rgba(140,0,0,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,MAIN_H);ctx.lineTo(W,MAIN_H);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#cc0000';ctx.font='bold 15px sans-serif';ctx.fillText('BFTC 対戦会',60,MAIN_H+34);
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 20px sans-serif';ctx.fillText('BRIDGE FTC',W/2,MAIN_H+34);
  ctx.textAlign='right';ctx.fillStyle='#444';ctx.font='13px "Noto Sans JP",sans-serif';ctx.fillText('闘う理由に、舞台を。',W-60,MAIN_H+34);
}

function renderCards(){
  if(!window._titleData)return;
  const x=window._titleData,tA=x.titlesA[x.selectedA],tB=x.titlesB[x.selectedB];
  const labels=['攻撃圧力','守備消耗','壁際支配','投げ攻め','パリィ力','SA活用'];
  const rv=(d,wc,tr)=>[
    Math.min(100,((d.cdr||0)+(d.od||0)+(d.pdr||0))*0.95),
    Math.min(100,((d.dr||0)+(d.dmg||0))*1.8),
    wc||50,tr||50,
    Math.min(100,(d.dpSuc||0)*20+(d.justParry||0)*15),
    Math.max(d.sa2||0,d.sa3||0)
  ];
  drawPlayerCard('cardCanvasA',x.nameA,x.charaA,tA,x.sA.type,rv(x.dA,x.wallCtrlA,x.throwRatioA),labels);
  drawPlayerCard('cardCanvasB',x.nameB,x.charaB,tB,x.sB.type,rv(x.dB,x.wallCtrlB,x.throwRatioB),labels);
}

function downloadCard(player){
  const canvasId=player==='A'?'cardCanvasA':'cardCanvasB';
  const canvas=document.getElementById(canvasId);
  if(!canvas||!window._titleData)return;
  const name=player==='A'?window._titleData.nameA:window._titleData.nameB;
  const link=document.createElement('a');
  link.download=`BFTC_${name}_card.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
  showToast(`✓ ${name}のカードをダウンロードしました`);
}
</script>
