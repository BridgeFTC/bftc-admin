<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BFTC | スタッツ比較</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24; --border: #2a2a3a;
  --accent: #e8003d; --gold: #f5c518; --text: #e8e8f0; --text-dim: #7a7a9a;
  --green: #00e57a; --blue: #0099ff; --purple: #9b59b6;
  --playerA: #e8003d; --playerB: #0099ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; min-height: 100vh; }

header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; }
.logo span { color: var(--accent); }

.container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

.input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.player-input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.player-input.playerA { border-top: 3px solid var(--playerA); }
.player-input.playerB { border-top: 3px solid var(--playerB); }
.player-label { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; margin-bottom: 12px; }
.playerA .player-label { color: var(--playerA); }
.playerB .player-label { color: var(--playerB); }

.name-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; padding: 10px 12px; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
.name-input:focus { border-color: var(--accent); }

.data-textarea { width: 100%; height: 200px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 12px; padding: 10px 12px; outline: none; resize: vertical; line-height: 1.6; transition: border-color 0.2s; }
.data-textarea:focus { border-color: var(--accent); }
.data-textarea::placeholder { color: var(--text-dim); }

.btn-generate { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 4px; color: white; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; cursor: pointer; transition: all 0.2s; margin-bottom: 32px; }
.btn-generate:hover { background: #c0002f; }

.result-section { display: none; }
.result-section.visible { display: block; }

.section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; border-left: 3px solid var(--accent); padding-left: 12px; }

.player-headers { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.player-header-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; text-align: center; }
.playerA-card { border-top: 3px solid var(--playerA); }
.playerB-card { border-top: 3px solid var(--playerB); }
.ph-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
.playerA-card .ph-name { color: var(--playerA); }
.playerB-card .ph-name { color: var(--playerB); }
.ph-sub { font-size: 12px; color: var(--text-dim); }

.chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.chart-wrap canvas { max-width: 100%; height: auto; }
.chart-legend { display: flex; gap: 24px; margin-top: 16px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

.compare-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
.compare-block-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; }

.stat-compare-row { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.stat-compare-row:last-child { border-bottom: none; }
.stat-name { text-align: center; font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
.val-higher { color: var(--green); }
.val-lower { color: var(--text-dim); }
.val-equal { color: var(--gold); }

.bar-wrap { display: flex; align-items: center; gap: 4px; }
.bar-A { height: 6px; background: var(--playerA); border-radius: 3px; transition: width 0.5s; }
.bar-B { height: 6px; background: var(--playerB); border-radius: 3px; transition: width 0.5s; }

.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.metric-title { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.metric-row:last-child { border-bottom: none; }
.metric-label { font-size: 13px; }
.metric-values { display: flex; gap: 16px; }
.metric-val { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
.metric-val-A { color: var(--playerA); }
.metric-val-B { color: var(--playerB); }

.style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.style-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; }
.style-card.playerA-card { border-left: 3px solid var(--playerA); }
.style-card.playerB-card { border-left: 3px solid var(--playerB); }
.style-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; margin-bottom: 6px; }
.style-type { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
.style-desc { font-size: 13px; line-height: 1.8; color: var(--text-dim); }
.style-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.style-tag { font-size: 11px; padding: 3px 8px; border-radius: 2px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }

.toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 4px; font-weight: 700; font-size: 13px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999; }
.toast.show { transform: translateY(0); opacity: 1; }

.match-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
.match-summary-vs { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; }
.match-summary-text { font-size: 15px; line-height: 1.9; color: var(--text); }
.match-summary-keyword { color: var(--gold); font-weight: 700; }

.individual-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.individual-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.individual-summary-card.playerA-card { border-left: 3px solid var(--playerA); }
.individual-summary-card.playerB-card { border-left: 3px solid var(--playerB); }
.individual-summary-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; margin-bottom: 8px; }
.playerA-card .individual-summary-name { color: var(--playerA); }
.playerB-card .individual-summary-name { color: var(--playerB); }
.individual-summary-text { font-size: 13px; line-height: 1.9; color: var(--text-dim); }

.cast-script-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 6px; padding: 24px; margin-bottom: 20px; position: relative; }
.cast-script-label { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; font-weight: 700; }
.cast-script-text { font-size: 14px; line-height: 2; color: var(--text); }
.cast-script-text em { color: var(--gold); font-style: normal; font-weight: 700; }
.btn-copy { position: absolute; top: 16px; right: 16px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-family: 'Noto Sans JP', sans-serif; font-size: 11px; padding: 4px 10px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
.btn-copy:hover { border-color: var(--gold); color: var(--gold); }

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  header { height: 52px; padding: 0 16px; }
  .logo { font-size: 20px; letter-spacing: 1px; }
  .container { padding: 16px 12px; }
  .input-section { grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
  .player-input { padding: 14px; }
  .name-input { font-size: 16px; }
  .data-textarea { height: 150px; font-size: 13px; }
  .btn-generate { font-size: 18px; padding: 14px; margin-bottom: 12px; }
  .section-title { font-size: 15px; margin-bottom: 10px; }
  .player-headers { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .player-header-card { padding: 10px 8px; }
  .ph-name { font-size: 16px; }
  .ph-sub { font-size: 10px; word-break: break-all; }
  .chart-wrap { padding: 12px 8px; margin-bottom: 16px; }
  .chart-legend { gap: 16px; font-size: 12px; margin-top: 10px; }
  .stat-compare-row { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 4px 8px; padding: 10px 0; }
  .stat-name { grid-column: 1 / -1; text-align: left; font-size: 11px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .bar-wrap { display: none; }
  .compare-block { padding: 12px; }
  .compare-block-title { font-size: 12px; margin-bottom: 8px; }
  .metrics-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  .metric-card { padding: 12px; }
  .metric-val { font-size: 16px; }
  .metric-label { font-size: 12px; }
  .style-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  .style-card { padding: 14px; }
  .individual-summary-grid { grid-template-columns: 1fr; gap: 10px; }
  .individual-summary-card { padding: 12px; }
  .match-summary-card { padding: 14px; }
  .match-summary-text { font-size: 13px; }
  .cast-script-card { padding: 14px; padding-top: 44px; }
  .cast-script-text { font-size: 13px; line-height: 1.9; }
}
@media (max-width: 375px) {
  .player-headers { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="logo">B<span>F</span>TC <span style="font-size:16px;color:var(--text-dim);letter-spacing:1px;">STATS COMPARE</span></div>
</header>

<div class="container">
  <div class="input-section">
    <div class="player-input playerA">
      <div class="player-label">PLAYER A</div>
      <input type="text" class="name-input" id="nameA" placeholder="選手名A">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <select class="name-input" id="rankA" style="margin-bottom:0">
          <option value="">ランク帯（任意）</option>
          <option>ROOKIE</option><option>IRON</option><option>BRONZE</option><option>SILVER</option><option>GOLD</option><option>PLATINUM</option><option>DIAMOND</option><option>MASTER〜1599</option><option>MASTER〜1699</option><option>MASTER〜1799</option><option>MASTER〜1899</option><option>MASTER〜2000</option><option>MASTER2000〜</option><option>LEGEND</option>
        </select>
        <select class="name-input" id="opA" style="margin-bottom:0">
          <option value="">操作タイプ（任意）</option><option>クラシック</option><option>モダン</option>
        </select>
      </div>
      <input type="text" class="name-input" id="charaA" placeholder="使用キャラクター（任意）">
      <textarea class="data-textarea" id="dataA" placeholder="例：
ドライブパリィ 15.27%
ドライブインパクト 3.70%
オーバードライブアーツ 23.57%
パリィドライブラッシュ 6.98%
キャンセルドライブラッシュ 25.61%
ドライブリバーサル 0.67%
ダメージ 24.16%
（CAPCOMのデータをそのまま貼り付けてください）"></textarea>
    </div>
    <div class="player-input playerB">
      <div class="player-label">PLAYER B</div>
      <input type="text" class="name-input" id="nameB" placeholder="選手名B">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <select class="name-input" id="rankB" style="margin-bottom:0">
          <option value="">ランク帯（任意）</option>
          <option>ROOKIE</option><option>IRON</option><option>BRONZE</option><option>SILVER</option><option>GOLD</option><option>PLATINUM</option><option>DIAMOND</option><option>MASTER〜1599</option><option>MASTER〜1699</option><option>MASTER〜1799</option><option>MASTER〜1899</option><option>MASTER〜2000</option><option>MASTER2000〜</option><option>LEGEND</option>
        </select>
        <select class="name-input" id="opB" style="margin-bottom:0">
          <option value="">操作タイプ（任意）</option><option>クラシック</option><option>モダン</option>
        </select>
      </div>
      <input type="text" class="name-input" id="charaB" placeholder="使用キャラクター（任意）">
      <textarea class="data-textarea" id="dataB" placeholder="例：
ドライブパリィ 15.16%
ドライブインパクト 0.93%
（CAPCOMのデータをそのまま貼り付けてください）"></textarea>
    </div>
  </div>

  <button class="btn-generate" onclick="generateCompare()">⚔ 比較を生成する</button>
  <button onclick="clearAll()" style="width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;font-size:13px;cursor:pointer;margin-top:-16px;margin-bottom:32px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">🗑 入力内容をクリア</button>

  <div class="result-section" id="resultSection">
    <div class="player-headers">
      <div class="player-header-card playerA-card"><div class="ph-name" id="rNameA">—</div><div class="ph-sub" id="rSubA"></div></div>
      <div class="player-header-card playerB-card"><div class="ph-name" id="rNameB">—</div><div class="ph-sub" id="rSubB"></div></div>
    </div>
    <div class="section-title">レーダーチャート比較</div>
    <div class="chart-wrap">
      <canvas id="radarChart"></canvas>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--playerA)"></div><span id="legendA">Player A</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--playerB)"></div><span id="legendB">Player B</span></div>
      </div>
    </div>
    <div class="section-title">ドライブゲージ使用傾向</div>
    <div class="compare-block" id="driveBlock"></div>
    <div class="section-title">詳細スタッツ比較</div>
    <div id="detailBlocks"></div>
    <div class="section-title">BFTC独自指標<span style="font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--text-dim);letter-spacing:0;margin-left:12px;font-weight:400;">（強さ指標ではなくスタイル指標）</span></div>
    <div class="metrics-grid" id="metricsGrid"></div>
    <div class="section-title">プレイスタイル総評</div>
    <div class="style-grid" id="styleGrid"></div>
    <div class="section-title">二つ名</div>
    <div class="style-grid" id="titleGrid"></div>
    <div class="section-title">マッチアップサマリ</div>
    <div id="matchSummary"></div>
    <div class="section-title">実況スクリプト</div>
    <div id="castScript"></div>
    <div class="section-title">X投稿文</div>
    <div id="xPost"></div>
    <div class="section-title">OBS用マッチカードURL</div>
    <div id="matchcardUrl"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxPhj1Dhtm-p9gXXd1hJlnO526i7488aK78aNNKiK__d6329QhH2U4fPQFwaaMWED2I/exec';

function clearAll(){
  ['nameA','nameB','charaA','charaB'].forEach(id=>document.getElementById(id).value='');
  ['rankA','rankB','opA','opB'].forEach(id=>document.getElementById(id).value='');
  ['dataA','dataB'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('resultSection').classList.remove('visible');
  usedTitles.clear(); showToast('✓ クリアしました');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function parseData(text){
  const d={};
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  const merged=[];
  for(let i=0;i<lines.length;i++){
    const cur=lines[i],next=lines[i+1]||'';
    if(/^[\d.,]+(%|回|秒|PT)?$/.test(cur)) continue;
    merged.push((next&&/^[\d.,]+(%|回|秒|PT)?$/.test(next))?cur+' '+next:cur);
  }
  const fullText=lines.join('\n')+'\n'+merged.join('\n');
  [
    {key:'dp',      r:/ドライブパリィ\s*([\d.]+)%/},
    {key:'di',      r:/ドライブインパクト\s*([\d.]+)%/},
    {key:'od',      r:/オーバードライブアーツ\s*([\d.]+)%/},
    {key:'pdr',     r:/パリィドライブラッシュ\s*([\d.]+)%/},
    {key:'cdr',     r:/キャンセルドライブラッシュ\s*([\d.]+)%/},
    {key:'dr',      r:/ドライブリバーサル\s*([\d.]+)%/},
    {key:'dmg',     r:/ダメージ\s*([\d.]+)%/},
    {key:'drUse',   r:/使用回数\s*([\d.]+)回/},
    {key:'dpSuc',   r:/成功回数\s*([\d.]+)回/},
    {key:'dpThrow', r:/相手のドライブパリィを投げた\s*([\d.]+)回/},
    {key:'dpThrown',r:/自分のドライブパリィを投げられた\s*([\d.]+)回/},
    {key:'justParry',r:/ジャストパリィ回数\s*([\d.]+)回/},
    {key:'diPC',    r:/パニッシュカウンターを決めた回数\s*([\d.]+)回/},
    {key:'diVsdi',  r:/相手のドライブインパクトに決めた回数\s*([\d.]+)回/},
    {key:'diRecvPC',r:/パニッシュカウンターを受けた回数\s*([\d.]+)回/},
    {key:'diReturn',r:/相手にドライブインパクトで返された回数\s*([\d.]+)回/},
    {key:'sa1',     r:/Lv1\s*([\d.]+)%/},
    {key:'sa2',     r:/Lv2\s*([\d.]+)%/},
    {key:'sa3',     r:/Lv3\s*([\d.]+)%/},
    {key:'ca',      r:/CA\s*([\d.]+)%/},
    {key:'throwEsc',r:/投げ抜け回数\s*([\d.]+)回/},
    {key:'wallAtk', r:/相手を追い詰めている時間\s*([\d.]+)秒/},
    {key:'wallDef', r:/相手に追い詰められている時間\s*([\d.]+)秒/},
    {key:'rankMatch',r:/ランクマッチプレイ回数\s*([\d,]+)回/},
    {key:'casual',  r:/カジュアルマッチプレイ回数\s*([\d,]+)回/},
    {key:'room',    r:/ルームマッチプレイ回数\s*([\d,]+)回/},
    {key:'hub',     r:/バトルハブマッチプレイ回数\s*([\d,]+)回/},
    {key:'pts',     r:/累計プレイポイント\s*([\d,]+)PT/},
    {key:'challenge',r:/チャレンジクリア回数\s*([\d,]+)回/},
  ].forEach(p=>{const m=fullText.match(p.r);if(m)d[p.key]=parseFloat(m[1].replace(/,/g,''));});
  const dhm=fullText.match(/決めた回数\s*([\d.]+)回/g);
  if(dhm&&dhm.length>=1){d.diHit=parseFloat(dhm[0].match(/([\d.]+)/)[0]);d.throwGive=dhm.length>=2?parseFloat(dhm[dhm.length-1].match(/([\d.]+)/)[0]):0;}
  const rm=fullText.match(/受けた回数\s*([\d.]+)回/g);
  if(rm&&rm.length>=1){d.diRecv=parseFloat(rm[0].match(/([\d.]+)/)[0]);d.throwRecv=rm.length>=2?parseFloat(rm[rm.length-1].match(/([\d.]+)/)[0]):0;}
  const sgm=fullText.match(/スタンさせた回数\s*([\d.]+)回/);if(sgm)d.stunGive=parseFloat(sgm[1]);
  const srm=fullText.match(/スタンさせられた回数\s*([\d.]+)回/);if(srm)d.stunRecv=parseFloat(srm[1]);
  return d;
}

function calcMetrics(d){
  return{
    attackIdx:Math.min(100,Math.round(((d.cdr||0)+(d.od||0)+(d.pdr||0))*0.95)),
    defenseIdx:Math.min(100,Math.round(((d.dr||0)+(d.dmg||0))*1.8)),
    wallCtrl:d.wallAtk&&d.wallDef?Math.round((d.wallAtk/(d.wallAtk+d.wallDef))*100):0,
    throwRatio:d.throwGive&&d.throwRecv?Math.round((d.throwGive/(d.throwGive+d.throwRecv))*100):0,
    saHigh:Math.max(d.sa2||0,d.sa3||0)
  };
}

function getPlayStyle(d,m){
  const tags=[],styles=[],wc=m.wallCtrl||0,tr=m.throwRatio||0;
  if(d.cdr>=40&&d.od>=25){tags.push('超攻撃特化型');styles.push('キャンセルドライブラッシュとOD技を軸に、ゲージを惜しみなく攻撃に注ぎ込む超攻撃特化スタイル');}
  else if(d.cdr>=35&&wc>=55){tags.push('壁詰め殲滅型');styles.push('キャンセルドライブラッシュで一気に距離を詰め、壁際に追い込んでから崩す前進コーナー攻略型');}
  else if(d.cdr>=35&&d.throwGive>=2.5){tags.push('接近投げ崩し型');styles.push('キャンセルドライブラッシュで間合いを詰めて投げを絡める、起き攻め・投げ崩しが得意なスタイル');}
  else if(d.cdr>=30&&d.pdr>=8){tags.push('変則ドライブラッシュ型');styles.push('キャンセルドライブラッシュとパリィドライブラッシュを使い分ける高度なドライブゲージ活用型');}
  else if(d.od>=30&&d.sa3>=30){tags.push('大技連打型');styles.push('OD技と高レベルSAを軸に、要所で大ダメージを狙う決め手重視の大技連打スタイル');}
  else if(d.od>=28){tags.push('OD多用型');styles.push('オーバードライブ技の使用率が突出して高く、ゲージをダメージに直結させる覚醒主義スタイル');}
  else if(d.pdr>=12&&d.dpSuc>=2){tags.push('パリィ攻め型');styles.push('パリィドライブラッシュとパリィ成功を攻撃の起点にする、読み合い重視の攻撃的カウンタースタイル');}
  else if(d.dpSuc>=3&&d.justParry>=1){tags.push('神域パリィ型');styles.push('通常パリィ・ジャストパリィの精度が異常に高い、相手の攻撃を見切ることを軸にした玄人スタイル');}
  else if(d.dpSuc>=2.5){tags.push('堅守反撃型');styles.push('パリィ精度が高く、相手の攻撃を受け流してから反撃する守備的カウンタースタイル');}
  else if(d.throwGive>=3.5&&wc>=55){tags.push('投げコーナー支配型');styles.push('投げを多用して相手をコーナーに追い込み、壁際の攻防で圧倒するグラップラースタイル');}
  else if(d.throwGive>=3){tags.push('投げ崩し特化型');styles.push('投げ命中率が際立って高く、打撃と投げの2択を武器に崩しを得意とするグラップラースタイル');}
  else if(wc>=65){tags.push('壁際絶対王者型');styles.push('壁際支配率が圧倒的に高く、一度コーナーに追い込んだら逃さない。コーナーこそが本領のスタイル');}
  else if(wc>=55){tags.push('コーナー主導型');styles.push('壁際での攻防を得意とし、相手をコーナーに追い込んでからの崩しで試合を組み立てるスタイル');}
  else if(d.sa3>=45){tags.push('SA3全振り型');styles.push('SAゲージのLv3集中率が極めて高い。必殺技一発に試合の流れを賭ける豪快な大技主義スタイル');}
  else if(d.sa2>=50){tags.push('SA2連打型');styles.push('SAゲージをLv2で使い続けるコスト効率重視スタイル。隙を見逃さず素早くSAを叩き込む');}
  else if(d.dr>=2){tags.push('リバーサル依存型');styles.push('ドライブリバーサルの使用率が高い。守りに入った場面での切り返しを得意とする防御反撃スタイル');}
  else if(m.defenseIdx>=60&&m.attackIdx<=40){tags.push('受け師型');styles.push('ゲージ消耗が多く守備に回る展開が多い。耐えながら相手のミスを誘うじっくり型スタイル');}
  else if(m.attackIdx>=60){tags.push('積極攻撃型');styles.push('ゲージを攻撃リソースとして効率よく使う積極攻撃スタイル。前に出て主導権を握ることを好む');}
  else if(m.attackIdx>=45&&m.defenseIdx<=35){tags.push('効率攻撃型');styles.push('ゲージ消耗が少なく攻撃に使えるゲージを常に確保しているタイプ。無駄のない立ち回りが特徴');}
  else if(d.pdr>=8){tags.push('パリィドライブラッシュ型');styles.push('パリィドライブラッシュを積極的に使う読み合い重視スタイル。相手の行動を読んで攻めに転じる');}
  else if(d.rankMatch>=40000){tags.push('歴戦の猛者型');styles.push('圧倒的な対戦経験値に裏打ちされた安定感が武器。試合の流れを読む能力に長けたベテランスタイル');}
  else{tags.push('総合バランス型');styles.push('特定の武器に偏らず、状況に応じてゲージの使い方を柔軟に変えるオールラウンドなバランス型');}
  if(d.justParry>=1&&!tags.includes('神域パリィ型'))tags.push('ジャストパリィ使い');
  if(d.cdr>=30&&!tags[0].includes('ドライブラッシュ'))tags.push('ドライブラッシュ活用');
  if(d.dmg>=28)tags.push('ゲージ消耗注意');
  if(d.rankMatch>=30000&&!tags.includes('歴戦の猛者型'))tags.push('ベテラン');
  return{type:tags[0],desc:styles[0]+'。',tags};
}

function drawRadar(dA,dB){
  const canvas=document.getElementById('radarChart'),ctx=canvas.getContext('2d');
  const container=canvas.parentElement;
  const size=Math.min(Math.max(container.offsetWidth-48,240),500);
  canvas.width=size;canvas.height=size;
  canvas.style.width=size+'px';canvas.style.height=size+'px';
  const cx=size/2,cy=size/2,lp=size<300?22:28,r=(size/2)-lp-10;
  ctx.clearRect(0,0,size,size);
  const axes=[
    {label:'攻撃圧力',vA:Math.min(100,((dA.cdr||0)+(dA.od||0)+(dA.pdr||0))*0.95),vB:Math.min(100,((dB.cdr||0)+(dB.od||0)+(dB.pdr||0))*0.95)},
    {label:'守備消耗',vA:Math.min(100,((dA.dr||0)+(dA.dmg||0))*1.8),vB:Math.min(100,((dB.dr||0)+(dB.dmg||0))*1.8)},
    {label:'壁際支配',vA:dA.wallAtk&&dA.wallDef?(dA.wallAtk/(dA.wallAtk+dA.wallDef))*100:50,vB:dB.wallAtk&&dB.wallDef?(dB.wallAtk/(dB.wallAtk+dB.wallDef))*100:50},
    {label:'投げ攻め',vA:dA.throwGive&&dA.throwRecv?(dA.throwGive/(dA.throwGive+dA.throwRecv))*100:50,vB:dB.throwGive&&dB.throwRecv?(dB.throwGive/(dB.throwGive+dB.throwRecv))*100:50},
    {label:'パリィ力',vA:Math.min(100,(dA.dpSuc||0)*20+(dA.justParry||0)*15),vB:Math.min(100,(dB.dpSuc||0)*20+(dB.justParry||0)*15)},
    {label:'SA活用', vA:Math.max(dA.sa2||0,dA.sa3||0),vB:Math.max(dB.sa2||0,dB.sa3||0)},
  ];
  const n=axes.length,st=(Math.PI*2)/n;
  for(let lv=1;lv<=5;lv++){const rr=r*lv/5;ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+st*i;i===0?ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}ctx.closePath();ctx.strokeStyle='#2a2a3a';ctx.lineWidth=1;ctx.stroke();}
  for(let i=0;i<n;i++){const a=-Math.PI/2+st*i;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='#2a2a3a';ctx.lineWidth=1;ctx.stroke();const lx=cx+(r+lp)*Math.cos(a),ly=cy+(r+lp)*Math.sin(a);ctx.fillStyle='#7a7a9a';ctx.font=`bold ${size<300?10:12}px Noto Sans JP`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(axes[i].label,lx,ly);}
  [{vals:axes.map(a=>a.vA),color:'#e8003d'},{vals:axes.map(a=>a.vB),color:'#0099ff'}].forEach(({vals,color})=>{ctx.beginPath();vals.forEach((v,i)=>{const a=-Math.PI/2+st*i,rr=r*Math.min(v,100)/100;i===0?ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));});ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle=color+'4d';ctx.fill();});
}

function makeCompareRow(label,valA,valB,uA='',uB=''){
  const a=parseFloat(valA)||0,b=parseFloat(valB)||0,max=Math.max(a,b,0.001);
  const wA=Math.round((a/max)*100),wB=Math.round((b/max)*100);
  const cA=a>b?'val-higher':a<b?'val-lower':'val-equal';
  const cB=b>a?'val-higher':b<a?'val-lower':'val-equal';
  return`<div class="stat-compare-row">
    <div style="text-align:right"><div class="${cA}" style="font-weight:700;font-size:15px">${valA}${uA}</div><div class="bar-wrap" style="justify-content:flex-end"><div class="bar-A" style="width:${wA}px;max-width:120px"></div></div></div>
    <div class="stat-name">${label}</div>
    <div><div class="${cB}" style="font-weight:700;font-size:15px">${valB}${uB}</div><div class="bar-wrap"><div class="bar-B" style="width:${wB}px;max-width:120px"></div></div></div>
  </div>`;
}

function generateCompare(){
  const nA=document.getElementById('nameA').value.trim()||'Player A';
  const nB=document.getElementById('nameB').value.trim()||'Player B';
  const rA=document.getElementById('rankA').value,rB=document.getElementById('rankB').value;
  const cA=document.getElementById('charaA').value.trim(),cB=document.getElementById('charaB').value.trim();
  const oA=document.getElementById('opA').value,oB=document.getElementById('opB').value;
  const tA=document.getElementById('dataA').value,tB=document.getElementById('dataB').value;

  const dA=parseData(tA),dB=parseData(tB);
  const mA=calcMetrics(dA),mB=calcMetrics(dB);

  document.getElementById('rNameA').textContent=nA;
  document.getElementById('rNameB').textContent=nB;

    ${makeCompareRow('ダメージ消費',dA.dmg||0,dB.dmg||0,'%','%')}
    ${makeCompareRow('OD技',dA.od||0,dB.od||0,'%','%')}
    ${makeCompareRow('ドライブパリィ',dA.dp||0,dB.dp||0,'%','%')}
    ${makeCompareRow('パリィドライブラッシュ',dA.pdr||0,dB.pdr||0,'%','%')}
    ${makeCompareRow('ドライブインパクト',dA.di||0,dB.di||0,'%','%')}
    ${makeCompareRow('ドライブリバーサル',dA.dr||0,dB.dr||0,'%','%')}`;

  document.getElementById('detailBlocks').innerHTML=`
    <div class="compare-block" style="margin-bottom:16px"><div class="compare-block-title">ドライブパリィ</div>${makeCompareRow('成功回数',dA.dpSuc||0,dB.dpSuc||0,'回','回')}${makeCompareRow('ジャストパリィ',dA.justParry||0,dB.justParry||0,'回','回')}</div>
    <div class="compare-block" style="margin-bottom:16px"><div class="compare-block-title">ドライブインパクト</div>${makeCompareRow('DI命中',dA.diHit||0,dB.diHit||0,'回','回')}${makeCompareRow('DI被弾',dA.diRecv||0,dB.diRecv||0,'回','回')}</div>
    <div class="compare-block" style="margin-bottom:16px"><div class="compare-block-title">SAゲージ使用割合（%）</div>${makeCompareRow('SA Lv1',dA.sa1||0,dB.sa1||0,'%','%')}${makeCompareRow('SA Lv2',dA.sa2||0,dB.sa2||0,'%','%')}${makeCompareRow('SA Lv3',dA.sa3||0,dB.sa3||0,'%','%')}${makeCompareRow('CA',dA.ca||0,dB.ca||0,'%','%')}</div>
    <div class="compare-block" style="margin-bottom:16px"><div class="compare-block-title">投げ</div>${makeCompareRow('投げ命中',dA.throwGive||0,dB.throwGive||0,'回','回')}${makeCompareRow('投げ被弾',dA.throwRecv||0,dB.throwRecv||0,'回','回')}${makeCompareRow('投げ抜け',dA.throwEsc||0,dB.throwEsc||0,'回','回')}</div>
    <div class="compare-block" style="margin-bottom:16px"><div class="compare-block-title">壁際</div>${makeCompareRow('追い詰め時間',dA.wallAtk||0,dB.wallAtk||0,'秒','秒')}${makeCompareRow('追い詰められ時間',dA.wallDef||0,dB.wallDef||0,'秒','秒')}</div>
    <div class="compare-block"><div class="compare-block-title">プレイ実績</div>${makeCompareRow('ランクマッチ',(dA.rankMatch||0).toLocaleString(),(dB.rankMatch||0).toLocaleString(),'回','回')}${makeCompareRow('ルームマッチ',(dA.room||0).toLocaleString(),(dB.room||0).toLocaleString(),'回','回')}${makeCompareRow('累計PT',(dA.pts||0).toLocaleString(),(dB.pts||0).toLocaleString(),'PT','PT')}${makeCompareRow('チャレンジクリア',(dA.challenge||0).toLocaleString(),(dB.challenge||0).toLocaleString(),'回','回')}</div>`;

  const wcB=dB.wallAtk&&dB.wallDef?Math.round((dB.wallAtk/(dB.wallAtk+dB.wallDef))*100):0;
  const trA=dA.throwGive&&dA.throwRecv?Math.round((dA.throwGive/(dA.throwGive+dA.throwRecv))*100):0;

    <div class="metric-card"><div class="metric-title">🔵 守備消耗度（/100）</div><div class="metric-row"><span class="metric-label">リバーサル＋ダメージ消費から算出</span><div class="metric-values"><span class="metric-val metric-val-A">${mA.defenseIdx}</span><span class="metric-val metric-val-B">${mB.defenseIdx}</span></div></div><div class="metric-row"><span class="metric-label" style="font-size:11px;color:var(--text-dim)">高いほどゲージを削られている / PC被弾 A:${dA.diRecvPC||0}回 B:${dB.diRecvPC||0}回（参考値）</span></div></div>

    <div class="metric-card"><div class="metric-title">⚪ 投げ攻勢率（%）</div><div class="metric-row"><span class="metric-label">投げ命中÷（命中+被弾）</span><div class="metric-values"><span class="metric-val metric-val-A">${trA}%</span><span class="metric-val metric-val-B">${trB}%</span></div></div><div class="metric-row"><span class="metric-label" style="font-size:11px;color:var(--text-dim)">高いほど投げで崩せている</span></div></div>`;

  const titA=generateTitle(nA,dA,mA,sA,wcA,trA);
  const titB=generateTitle(nB,dB,mB,sB,wcB,trB);

  document.getElementById('styleGrid').innerHTML=`
    <div class="style-card playerA-card"><div class="style-name">${nA}</div><div class="style-type">${sA.type}</div><div class="style-desc">${sA.desc}</div><div class="style-tags">${sA.tags.map(t=>`<span class="style-tag">${t}</span>`).join('')}</div><div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);line-height:1.8;">${styleReason(dA,mA,sA,wcA,trA)}</div></div>
    <div class="style-card playerB-card"><div class="style-name">${nB}</div><div class="style-type">${sB.type}</div><div class="style-desc">${sB.desc}</div><div class="style-tags">${sB.tags.map(t=>`<span class="style-tag">${t}</span>`).join('')}</div><div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);line-height:1.8;">${styleReason(dB,mB,sB,wcB,trB)}</div></div>`;

  const [tA1,tA2,tA3,tA1c,tA2c,tA3c]=titA;
  const [tB1,tB2,tB3,tB1c,tB2c,tB3c]=titB;

  window._td={nA,nB,cA,cB,rA,rB,oA,oB,dA,dB,mA,mB,sA,sB,wcA,wcB,trA,trB,titA,titB,catsA:[tA1c,tA2c,tA3c],catsB:[tB1c,tB2c,tB3c],selA:0,selB:0};

  function titleCard(name,titles,cats,player,tR){
    const [t1,t2,t3,t1c,t2c,t3c]=titles;
    const d_=player==='A'?dA:dB,m_=player==='A'?mA:mB,s_=player==='A'?sA:sB,wc_=player==='A'?wcA:wcB,tr_=player==='A'?trA:trB;
    return`<div class="style-card player${player}-card">
      <div class="style-name">${name}</div>

  const sumA=indivSummary(nA,dA,mA,sA,wcA,trA),sumB=indivSummary(nB,dB,mB,sB,wcB,trB);
  document.getElementById('matchSummary').innerHTML=`
    <div class="match-summary-card"><div class="match-summary-vs">⚔ MATCHUP ANALYSIS</div><div class="match-summary-text">${matchSummary(nA,nB,dA,dB,mA,mB,sA,sB,wcA,wcB)}</div></div>
    <div class="individual-summary-grid">
      <div class="individual-summary-card playerA-card"><div class="individual-summary-name">${nA}</div><div class="individual-summary-text">${sumA}</div></div>

function indivSummary(name,d,m,s,wc,tr){
  const ls=[];
  ls.push(`過去100戦平均のバトルの傾向によると、CDR${d.cdr||0}%・OD${d.od||0}%・パリィドライブラッシュ${d.pdr||0}%と、ゲージ攻撃活用率<strong>${m.attackIdx}/100</strong>。`);
  ls.push(wc>=55?`壁際支配率${wc}%と高く、コーナーでの崩しを得意とする。`:wc<=45?`壁際支配率${wc}%と低め。追い詰められる場面が多い傾向。`:`壁際の攻防は${wc}%とほぼ互角。`);
  ls.push(tr>=55?`投げ攻勢率${tr}%と投げを積極的に活用する崩し型。`:`投げ攻勢率${tr}%。技での崩しを好むスタイル。`);

function selectTitle(player,index){
  if(!window._td) return;
  if(player==='A')window._td.selA=index;else window._td.selB=index;
  for(let i=0;i<3;i++){
    const btn=document.getElementById(`titleBtn${player}${i}`);
    if(!btn)continue;
    const act=i===(player==='A'?window._td.selA:window._td.selB);
    btn.style.background=act?'var(--accent)':'var(--surface2)';
    btn.style.borderColor=act?'var(--accent)':'var(--border)';
    btn.style.color=act?'white':'var(--text-dim)';
  }
  const x=window._td,iA=x.selA,iB=x.selB;
  const tA=x.titA[iA],tB=x.titB[iB],tAc=x.catsA[iA],tBc=x.catsB[iB];
  const elA=document.getElementById('selectedTitleA'),elB=document.getElementById('selectedTitleB');
  if(elA)elA.textContent=`『${tA}』`;if(elB)elB.textContent=`『${tB}』`;
  const rA_=document.getElementById('reasonA'),rB_=document.getElementById('reasonB');
  if(player==='A'&&rA_)rA_.innerHTML=titleReason(x.dA,x.mA,x.sA,x.wcA,x.trA,tA,tAc);
  if(player==='B'&&rB_)rB_.innerHTML=titleReason(x.dB,x.mB,x.sB,x.wcB,x.trB,tB,tBc);
  updateAll();
}

function styleReason(d,m,s,wc,tr){
  const type=s.type,parts=[];
  if(type.includes('超攻撃')||type.includes('積極攻撃')||type.includes('OD')||type.includes('大技連打'))parts.push(`攻撃圧力指数${m.attackIdx}/100（CDR${d.cdr||0}%・OD${d.od||0}%・パリィドライブラッシュ${d.pdr||0}%）`);
  if(type.includes('壁際')||type.includes('コーナー')||type.includes('壁詰め'))parts.push(`壁際支配率${wc}%（追い詰め${d.wallAtk||0}秒 vs ${d.wallDef||0}秒）`);
  if(type.includes('投げ'))parts.push(`投げ命中${d.throwGive||0}回・投げ攻勢率${tr}%`);
  if(type.includes('パリィ'))parts.push(`パリィ成功${d.dpSuc||0}回・ジャストパリィ${d.justParry||0}回`);
  if(type.includes('SA3'))parts.push(`SA Lv3使用率${d.sa3||0}%`);
  if(type.includes('SA2'))parts.push(`SA Lv2使用率${d.sa2||0}%`);
  if(type.includes('守備')||type.includes('受け師')||type.includes('リバーサル'))parts.push(`守備消耗度${m.defenseIdx}/100・ダメージ消費${d.dmg||0}%`);
  if(parts.length===0)parts.push(`攻撃圧力指数${m.attackIdx}/100・守備消耗度${m.defenseIdx}/100・壁際支配率${wc}%の総合判定`);
  return '判定根拠：'+parts.join('、')+'。';
}

function titleReason(d,m,s,wc,tr,title,cat){
  switch(cat){
    case 'cdr_high': return `キャンセルドライブラッシュ使用率${d.cdr||0}%。積極的に間合いを詰めて攻撃する前進スタイルが数字に表れているため。`;
    case 'od_high':  return `OD技使用率${d.od||0}%。ゲージをダメージに直結させるスタイルからこの二つ名に。`;
    case 'pdr_high': return `パリィドライブラッシュ使用率${d.pdr||0}%。弾いてから踏み込む積極的なスタイルが数字に表れているため。`;
    case 'wall_high':return `壁際追い詰め時間${d.wallAtk||0}秒・追い詰められ時間${d.wallDef||0}秒。コーナーでの主導権を握り続けるスタイルからこの二つ名に。`;
    case 'throw_high':return `投げ命中${d.throwGive||0}回・投げ攻勢率${tr}%。投げを主軸に崩すスタイルが数字から読み取れるため。`;
    case 'parry_high':return `パリィ成功${d.dpSuc||0}回。パリィで場を支配するスタイルが数字に表れているため。`;
    case 'just_high': return `ジャストパリィ${d.justParry||0}回。この精度は反応精度が突出して高い証拠。この精度からこの二つ名に。`;
    case 'sa3_high':  return `SA Lv3使用率${d.sa3||0}%。ゲージを最大まで溜めてから一気に放つ大技主義からこの二つ名に。`;
    case 'sa2_high':  return `SA Lv2使用率${d.sa2||0}%。コスト効率の良いSAを主軸にテンポよく奥義を当てるスタイルからこの二つ名に。`;
    case 'sa1_high':  return `SA Lv1使用率${d.sa1||0}%。素早いSAを連射して手数で圧倒するスタイルからこの二つ名に。`;
    case 'di_high':   return `ドライブインパクト命中${d.diHit||0}回。DIを積極的に仕掛けて試合を動かすスタイルからこの二つ名に。`;
    case 'reversal':  return `ドライブリバーサル使用率${d.dr||0}%。守りから一瞬で切り返すスタイルがデータに表れているため。`;
    case 'veteran':   return `ランクマッチ${(d.rankMatch||0).toLocaleString()}回・累計${(d.pts||0).toLocaleString()}PT。この対戦数が示す長年の実戦経験がこの二つ名の根拠。`;
    case 'efficient': return `ダメージ消費${d.dmg||0}%が低く、ゲージを守備で削られる場面が少ない。効率的な立ち回りからこの二つ名に。`;
    case 'defense':   return `ダメージ消費${d.dmg||0}%・リバーサル${d.dr||0}%と、ゲージを削られる場面が多い。それでも前に出続けるスタイルからこの二つ名に。`;
    case 'ground_control': return `壁際より地上戦・中距離の攻防が主体になっているデータからこの二つ名に。`;
    case 'pressure':  return `攻撃圧力指数${m.attackIdx}/100。ゲージを攻撃に集中させる高い圧力がデータに表れているため。`;
    default:{const opts=[{val:d.cdr||0,text:`CDR${d.cdr||0}%`},{val:d.od||0,text:`OD${d.od||0}%`},{val:wc,text:`壁際支配率${wc}%`},{val:tr,text:`投げ攻勢率${tr}%`}].sort((a,b)=>b.val-a.val);return `最も突出した数値は${opts[0].text}。読み合い・地上戦で戦うスタイルからこの二つ名に。`;}
  }
}

function matchSummary(nA,nB,dA,dB,mA,mB,sA,sB,wcA,wcB){
  const ls=[],ad=mA.attackIdx-mB.attackIdx,wd=wcA-wcB;
  ls.push(`過去100戦平均のバトルの傾向によると、<span class="match-summary-keyword">${nA}</span>と<span class="match-summary-keyword">${nB}</span>のマッチアップは、`);
  if(Math.abs(ad)>=15){const att=ad>0?nA:nB,def=ad>0?nB:nA;ls.push(`攻撃圧力では${att}が優位（${Math.max(mA.attackIdx,mB.attackIdx)} vs ${Math.min(mA.attackIdx,mB.attackIdx)}）。${def}がいかにゲージを守りながら反撃の機会を作れるかが鍵。`);}
  else ls.push(`攻撃圧力は両者ほぼ拮抗（${mA.attackIdx} vs ${mB.attackIdx}）。読み合いの精度が勝敗を分けるカード。`);
  if(Math.abs(wd)>=10)ls.push(`壁際支配ではデータ上${wd>0?nA:nB}が有利。コーナーの攻防がこの試合のハイライトになる可能性が高い。`);
  if(sA.type!==sB.type)ls.push(`スタイルの異なる「${sA.type}」vs「${sB.type}」の好カード。`);
  return ls.join('');
}

  default:['読み合いで制する者','駆け引きの鬼','読みで崩す格闘家','読み勝ちで完結する者','駆け引きの申し子','読み合いの覇者','差し合いで読み勝つ者','地上戦で制する猛者','ペースを握る格闘家','試合を組み立てる猛者','流れを変える鬼','冷静に崩す格闘家','差し合いの申し子','地上を制する鬼','地上の覇者']
};

function generateTitle(name,d,m,s,wc,tr){
  const cats=[];
  if(d.cdr>=35)cats.push({k:'cdr_high',p:TP.cdr_high});
  if(d.od>=30) cats.push({k:'od_high', p:TP.od_high});
  if(d.pdr>=10)cats.push({k:'pdr_high',p:TP.pdr_high});
  if(wc>=60)   cats.push({k:'wall_high',p:TP.wall_high});
  if(tr>=60)   cats.push({k:'throw_high',p:TP.throw_high});
  if(d.dpSuc>=3)cats.push({k:'parry_high',p:TP.parry_high});
  if(d.justParry>=1)cats.push({k:'just_high',p:TP.just_high});
  if(d.sa3>=40)cats.push({k:'sa3_high',p:TP.sa3_high});
  if(d.sa2>=50)cats.push({k:'sa2_high',p:TP.sa2_high});
  if(d.sa1>=50)cats.push({k:'sa1_high',p:TP.sa1_high});
  if(d.di>=3)  cats.push({k:'di_high', p:TP.di_high});
  if(d.dr>=2)  cats.push({k:'reversal',p:TP.reversal});
  if(d.rankMatch>=30000)cats.push({k:'veteran',p:TP.veteran});
  if(m.defenseIdx<=30)cats.push({k:'efficient',p:TP.efficient});
  if(m.defenseIdx>=60)cats.push({k:'defense',p:TP.defense});
  if(wc<=45)   cats.push({k:'ground_control',p:TP.ground_control});
  if(m.attackIdx>=65)cats.push({k:'pressure',p:TP.pressure});
  cats.push({k:'default',p:TP.default});
  const inv={k:'inverted',p:TP.inverted};
  const useInv=Math.random()<0.5;
  const p1=useInv?[...cats,inv]:cats,p2=useInv?cats:[...cats,inv];
  const pick=(pool,excl=[])=>{
    for(const c of [...pool].sort(()=>Math.random()-0.5)){
      const av=c.p.filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&!excl.includes(t));
      if(av.length>0){const t=av[Math.floor(Math.random()*av.length)];usedTitles.add(t);return[t,c.k];}
    }
    const all=cats.flatMap(c=>c.p).filter(t=>!EXISTING_TITLES.includes(t)&&!usedTitles.has(t)&&!excl.includes(t));
    const t=all.length>0?all[Math.floor(Math.random()*all.length)]:TP.default[0];usedTitles.add(t);return[t,'default'];
  };
  const [t1,t1k]=pick(p1);
  const [t2,t2k]=pick(p2.filter(c=>c.k!==t1k),[t1]);
  const [t3,t3k]=pick(cats.filter(c=>c.k!==t1k&&c.k!==t2k&&c.k!=='inverted'),[t1,t2]);
  return[t1,t2,t3,t1k,t2k,t3k];
}

function castScript(nA,nB,dA,dB,mA,mB,sA,sB,wcA,wcB,trA,trB,rA,rB,cA,cB,oA,oB,titA,titB){
  const kA=sA.tags[0]||'アグレッシブ',kB=sB.tags[0]||'バランス型';
  const inA=[rA,cA,oA].filter(Boolean).join('・'),inB=[rB,cB,oB].filter(Boolean).join('・');
  const tA=titA?titA[0]:sA.type,tB=titB?titB[0]:sB.type;
  const kps=[];
  const wmax=Math.max(wcA,wcB),wwin=wcA>=wcB?nA:nB;
  const odmax=Math.max(dA.od||0,dB.od||0),odwin=(dA.od||0)>=(dB.od||0)?nA:nB;
  const cmax=Math.max(dA.cdr||0,dB.cdr||0),cwin=(dA.cdr||0)>=(dB.cdr||0)?nA:nB;
  const tmax=Math.max(trA,trB),twin=trA>=trB?nA:nB;
  const pmax=Math.max(dA.dpSuc||0,dB.dpSuc||0),pwin=(dA.dpSuc||0)>=(dB.dpSuc||0)?nA:nB;
  const s3max=Math.max(dA.sa3||0,dB.sa3||0),s3win=(dA.sa3||0)>=(dB.sa3||0)?nA:nB;
  if(Math.abs(wcA-wcB)>=10)kps.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wwin}の壁際支配率は${wmax}%。コーナーに追い込んだ後の崩しパターンに注目してください。`);
  if(tmax>=55)kps.push(`<em>投げの読み合い</em>も見逃せません。${twin}の投げ攻勢率${tmax}%と、接近戦での投げ択が試合の流れを左右しそうです。`);
  if(odmax>=28)kps.push(`<em>OD技の使いどころ</em>がこの試合の分岐点になりそうです。${odwin}のOD技使用率${odmax}%。`);
  if(cmax>=35)kps.push(`<em>ドライブラッシュへの対応</em>が鍵を握ります。${cwin}のキャンセルドライブラッシュ${cmax}%は高水準。`);
  if(pmax>=2.5)kps.push(`<em>パリィの読み合い</em>にも注目です。${pwin}のパリィ成功${pmax}回は高水準。`);
  if(s3max>=40)kps.push(`<em>必殺技のタイミング</em>も見どころです。${s3win}のSA3使用率${s3max}%。`);
  if(kps.length===0)kps.push(`データが示すキーポイントは<em>壁際の攻防</em>です。${wwin}の壁際支配率${wmax}%。コーナーでの攻防に注目してください。`);
  return`さあ始まりました！本日の注目カードは<em>${nA}</em> vs <em>${nB}</em>！<br><br>
    今回の対戦カードは<em>『${tA}』${nA}</em>と<em>『${tB}』${nB}</em>です。<br><br>
    ${inA?`${nA}は<em>${inA}</em>。`:''}過去100戦平均の傾向によると、${nA}のプレイスタイルは<em>${kA}</em>型。CDR${dA.cdr||0}%、OD${dA.od||0}%と、ゲージを攻撃に集中させる前線圧力型プレイヤーです。<br><br>
    ${inB?`対する${nB}は<em>${inB}</em>。`:`対する${nB}は`}<em>${kB}</em>型。${(dB.throwGive||0)>3?`投げ命中${dB.throwGive||0}回と投げを絡めた崩しが武器。`:`パリィドライブラッシュ${dB.pdr||0}%とゲージの使い分けが巧みなプレイヤー。`}<br><br>
    ${kps.slice(0,2).join('<br>')}<br><br>
    それでは、試合開始です！<br><br>
    <span style="font-size:12px;color:var(--text-dim);border-top:1px solid var(--border);display:block;padding-top:12px;margin-top:8px;">📌 二つ名候補（${nA}）：『${titA[0]}』／『${titA[1]}』／『${titA[2]}』<br>📌 二つ名候補（${nB}）：『${titB[0]}』／『${titB[1]}』／『${titB[2]}』</span>`;
}

function xPostText(nA,nB,tA,tB,cA,cB){
  const a=cA?`(${cA})`:'',b=cB?`(${cB})`:'';
  const t=`⚔️ 対戦カード紹介\n\n『${tA}』${nA}${a}\n\nvs\n\n『${tB}』${nB}${b}\n\n📺 twitch.tv/bridgeftc\n#BridgeFTC #対戦カード`;
  return t.length<=140?t:t.slice(0,137)+'...';
}
function updateXPost(){
  if(!window._td)return;
  const x=window._td,tA=x.titA[x.selA],tB=x.titB[x.selB];
  const txt=xPostText(x.nA,x.nB,tA,tB,x.cA,x.cB);
  const el=document.getElementById('xPostText'),cnt=document.getElementById('xCharCount');
  if(el)el.innerText=txt;if(cnt)cnt.textContent=txt.length+'文字';
}
function copyXPost(){const el=document.getElementById('xPostText');navigator.clipboard.writeText(el.innerText).then(()=>showToast('✓ X投稿文をコピーしました'));}
function copyScript(){const el=document.getElementById('castScriptText');navigator.clipboard.writeText(el.innerText).then(()=>showToast('✓ スクリプトをコピーしました'));}
</script>
