<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>転職トレードオフ評価ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEEEC;
    --surface: #FFFFFF;
    --surface-sunken: #F2F4F2;
    --ink: #181D24;
    --ink-soft: #5B6470;
    --line: #D7DCD8;
    --gold: #A8762B;
    --gold-soft: #F1E4CC;
    --green: #2F6B4F;
    --green-soft: #DCEAE2;
    --red: #A8392E;
    --red-soft: #F3DEDA;
    --gray-soft: #E7E5E0;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(24,29,36,0.04), 0 4px 14px rgba(24,29,36,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:860px; margin:0 auto; padding:28px 20px 80px; }
  h1,h2,h3{ font-family:'Zen Kaku Gothic New', sans-serif; margin:0; letter-spacing:0.01em; }
  header.top{ margin-bottom:22px; }
  header.top .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em;
    color:var(--gold); text-transform:uppercase; margin-bottom:6px;
  }
  header.top h1{ font-size:25px; font-weight:900; line-height:1.4; }
  header.top p.lede{ margin:10px 0 0; font-size:13.5px; line-height:1.85; color:var(--ink-soft); max-width:640px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;
  }
  .card h2{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .card h2 .num{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold);
    background:var(--gold-soft); padding:2px 7px; border-radius:5px;
  }
  .card .sub{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 16px; line-height:1.7; }
  details.settings{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden;
  }
  details.settings > summary{
    cursor:pointer; list-style:none; padding:16px 22px; font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700; font-size:14px; display:flex; justify-content:space-between; align-items:center;
  }
  details.settings > summary::-webkit-details-marker{display:none;}
  details.settings > summary .arrow{ font-size:12px; color:var(--ink-soft); transition:transform .15s ease; }
  details.settings[open] > summary .arrow{ transform:rotate(90deg); }
  .settings-body{ padding:0 22px 20px; border-top:1px solid var(--line); }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1 1 160px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; color:var(--ink-soft); font-weight:500; }
  .field input[type=number], .field input[type=text]{
    border:1px solid var(--line); border-radius:7px; padding:9px 10px; font-size:13.5px;
    font-family:'JetBrains Mono', monospace; background:var(--surface-sunken); color:var(--ink);
  }
  .field input[type=text]{ font-family:'Noto Sans JP', sans-serif; }
  .field textarea{
    border:1px solid var(--line); border-radius:7px; padding:10px; font-size:13px;
    font-family:'Noto Sans JP', sans-serif; background:var(--surface-sunken); color:var(--ink);
    resize:vertical; min-height:84px; line-height:1.7;
  }
  .field textarea.report{ min-height:160px; }
  .field input:focus, .field textarea:focus, select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .weight-note{ font-size:11.5px; color:var(--ink-soft); margin-top:-2px; }
  .rating{ display:flex; gap:6px; align-items:center; }
  .rating button{
    width:30px;height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface-sunken); color:var(--ink-soft); font-family:'JetBrains Mono', monospace;
    font-size:13px; cursor:pointer;
  }
  .rating button.active{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .hardreq{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .hardreq .group{ flex:1 1 220px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface-sunken); }
  .hardreq .group label.title{ font-size:12px; font-weight:600; color:var(--ink); display:block; margin-bottom:8px; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button{ flex:1; border:none; background:var(--surface); color:var(--ink-soft); font-size:12px; padding:7px 0; cursor:pointer; border-right:1px solid var(--line); }
  .seg button:last-child{border-right:none;}
  .seg button.active{ background:var(--ink); color:#fff; }
  .btn{ border:none; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Noto Sans JP', sans-serif; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#000; }
  .btn-ghost{ background:var(--surface-sunken); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--gray-soft); }
  .btn-ai{ background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold); }
  .btn-ai:hover{ background:var(--gold); color:#fff; }
  .btn-danger{ background:var(--red-soft); color:var(--red); border:1px solid var(--red); }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; flex-wrap:wrap; }
  .ai-status{ font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.6; }
  .ai-status.err{ color:var(--red); }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 18px; border-radius:20px; font-size:12.5px; box-shadow:var(--shadow);
    opacity:0; transition:opacity .2s ease; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; }
  .list-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .list-head h2{ margin:0; }
  .empty{ text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:13px; line-height:1.8; }
  .entry{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px;
  }
  .entry-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .entry-name{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:16px; }
  .entry-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .score-block{ text-align:right; min-width:120px; }
  .score-num{ font-family:'JetBrains Mono', monospace; font-size:26px; font-weight:700; line-height:1; }
  .score-label{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .verdict{ display:inline-block; margin-top:6px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .verdict.go{ background:var(--green-soft); color:var(--green); }
  .verdict.watch{ background:var(--gray-soft); color:var(--ink-soft); }
  .verdict.block{ background:var(--red-soft); color:var(--red); }
  .beam-row{ display:flex; align-items:center; gap:16px; margin:14px 0 10px; }
  .beam-row svg{ flex:0 0 auto; }
  .axis-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px 18px; font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .axis-grid .axis-name{ color:var(--ink); font-weight:500; }
  .axis-grid .axis-val{ font-family:'JetBrains Mono', monospace; color:var(--ink); }
  .badges{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .badge{ font-size:10.5px; padding:3px 8px; border-radius:5px; font-weight:600; }
  .badge.ok{ background:var(--green-soft); color:var(--green); }
  .badge.no{ background:var(--red-soft); color:var(--red); }
  .badge.unclear{ background:var(--gray-soft); color:var(--ink-soft); }
  .report-text{
    margin-top:12px; font-size:13px; line-height:1.85; color:var(--ink);
    background:var(--surface-sunken); border-radius:8px; padding:14px 16px; white-space:pre-wrap;
  }
  .entry-actions{ display:flex; gap:8px; margin-top:14px; }
  .entry-actions .btn{ padding:7px 13px; font-size:12px; }
  details.notes{ margin-top:10px; }
  details.notes summary{ font-size:11.5px; color:var(--ink-soft); cursor:pointer; }
  details.notes .notes-body{
    margin-top:6px; font-size:12.5px; line-height:1.8; color:var(--ink); white-space:pre-wrap;
    background:var(--surface-sunken); border-radius:7px; padding:10px 12px;
  }
  footer.note{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:30px; line-height:1.8; }
  @media (max-width:520px){
    .score-block{ text-align:left; min-width:auto; width:100%; }
    .entry-top{ flex-direction:column; }
    .beam-row{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ storage helpers ============ */
async function loadJSON(key, fallback){
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value){ return JSON.parse(res.value); }
    return fallback;
  }catch(e){ return fallback; }
}
async function saveJSON(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch(e){ console.error('storage save failed', e); return false; }
}

/* ============ state ============ */
const DEFAULT_SETTINGS = {
  weights: { income:40, stability:25, autonomy:20, wlb:15 },
  baselineRatings: { stability:5, autonomy:5, wlb:5 },
  currentSalary: null
};
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let evaluations = [];
let formDraft = blankDraft();
let editingId = null;
let aiState = { loading:false, error:null };

function blankDraft(){
  return {
    companyName:'', source:'', jobText:'',
    offeredSalary:'', salaryGap:'',
    remote:'unclear', aiCompany:'unclear',
    stability:3, autonomy:3, wlb:3,
    report:'', notes:''
  };
}

/* ============ scoring ============ */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function incomeScore(gapManYen){
  if(gapManYen === '' || gapManYen === null || isNaN(gapManYen)) return 50;
  return clamp(50 + (Number(gapManYen)/100)*50, 0, 100);
}
function axisScore(rating){ return clamp((Number(rating)/5)*100, 0, 100); }
function normalizedWeights(w){
  const sum = w.income + w.stability + w.autonomy + w.wlb;
  if(sum <= 0) return { income:0.4, stability:0.25, autonomy:0.2, wlb:0.15 };
  return { income: w.income/sum, stability: w.stability/sum, autonomy: w.autonomy/sum, wlb: w.wlb/sum };
}
function totalScore({gap, stability, autonomy, wlb}, weights){
  const nw = normalizedWeights(weights);
  const s = incomeScore(gap)*nw.income + axisScore(stability)*nw.stability +
            axisScore(autonomy)*nw.autonomy + axisScore(wlb)*nw.wlb;
  return Math.round(s*10)/10;
}
function baselineScore(){
  return totalScore({
    gap:0,
    stability: settings.baselineRatings.stability,
    autonomy: settings.baselineRatings.autonomy,
    wlb: settings.baselineRatings.wlb
  }, settings.weights);
}
function hardReqFailed(entry){ return entry.remote === 'no' || entry.aiCompany === 'no'; }
function hardReqUnclear(entry){ return entry.remote === 'unclear' || entry.aiCompany === 'unclear'; }
function verdictFor(entry, score, base){
  if(hardReqFailed(entry)) return {tag:'block', label:'必須条件未達'};
  if(hardReqUnclear(entry)) return {tag:'watch', label:'必須条件 要確認'};
  if(score >= base + 3) return {tag:'go', label:'現職を上回る可能性'};
  if(score >= base - 5) return {tag:'watch', label:'現職とほぼ同水準'};
  return {tag:'block', label:'現職の方が良い可能性'};
}

/* ============ beam svg ============ */
function beamSVG(score, base, status){
  const cx=130, beamY=46, swing=26;
  const delta = clamp((score-base)*0.55, -swing, swing);
  const leftY = beamY - delta;
  const rightY = beamY + delta;
  const leftX = 26, rightX = 234;
  let strokeColor = '#8A8F86';
  if(status==='go') strokeColor = 'var(--green)';
  else if(status==='block') strokeColor = 'var(--red)';
  else strokeColor = 'var(--gold)';
  return `
  <svg width="260" height="100" viewBox="0 0 260 100" aria-hidden="true">
    <line x1="${cx}" y1="${beamY-2}" x2="${cx}" y2="78" stroke="#C9CCC6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="${cx-9},86 ${cx+9},86 ${cx},74" fill="#C9CCC6"/>
    <line x1="${leftX}" y1="${leftY}" x2="${rightX}" y2="${rightY}" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round"/>
    <line x1="${leftX}" y1="${leftY}" x2="${leftX}" y2="${leftY+20}" stroke="${strokeColor}" stroke-width="2"/>
    <line x1="${rightX}" y1="${rightY}" x2="${rightX}" y2="${rightY+20}" stroke="${strokeColor}" stroke-width="2"/>
    <circle cx="${leftX}" cy="${leftY+26}" r="8" fill="none" stroke="${strokeColor}" stroke-width="2.5"/>
    <circle cx="${rightX}" cy="${rightY+26}" r="8" fill="none" stroke="${strokeColor}" stroke-width="2.5"/>
    <text x="${leftX}" y="${leftY+44}" font-size="10" fill="#5B6470" text-anchor="middle" font-family="Noto Sans JP, sans-serif">現職</text>
    <text x="${rightX}" y="${rightY+44}" font-size="10" fill="#5B6470" text-anchor="middle" font-family="Noto Sans JP, sans-serif">この候補</text>
  </svg>`;
}

/* ============ rendering ============ */
function render(){
  const base = baselineScore();
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader(base)}
    ${renderSettings()}
    ${renderForm()}
    ${renderList(base)}
    <footer class="note">入力内容はこのブラウザのアカウントに保存され、次回開いたときも引き続き使えます。AIによる読み取り・評価コメントは下書きです。保存前に内容を確認してください。</footer>
  `;
  bindEvents();
}

function renderHeader(base){
  return `
  <header class="top">
    <div class="eyebrow">Job Offer Tradeoff Evaluator</div>
    <h1>転職トレードオフ評価ツール</h1>
    <p class="lede">現職は収入以外の3軸（安定性・自律性・WLB）をすでに満たしている、という前提のもとで、新しい求人が「現職の良さを手放してでも取りに行く価値があるか」をスコア化します。現職を維持した場合の基準スコアは <strong style="font-family:'JetBrains Mono',monospace;color:var(--gold);">${base}</strong> 点です。</p>
  </header>`;
}

function renderSettings(){
  const w = settings.weights, b = settings.baselineRatings;
  return `
  <details class="settings" id="settingsPanel">
    <summary>重みと現職の基準値を調整する <span class="arrow">▸</span></summary>
    <div class="settings-body">
      <div class="field" style="margin-top:14px;">
        <label>現在の年収（万円・任意）</label>
        <input type="number" id="currentSalary" value="${settings.currentSalary ?? ''}" placeholder="例: 600">
      </div>
      <p class="weight-note" style="margin-top:14px;">各軸の重み（比率として扱われるため合計が100でなくても自動調整されます）</p>
      <div class="field-row">
        <div class="field"><label>収入アップ</label><input type="number" id="w_income" value="${w.income}"></div>
        <div class="field"><label>安定性・将来性</label><input type="number" id="w_stability" value="${w.stability}"></div>
        <div class="field"><label>自律性</label><input type="number" id="w_autonomy" value="${w.autonomy}"></div>
        <div class="field"><label>WLB</label><input type="number" id="w_wlb" value="${w.wlb}"></div>
      </div>
      <p class="weight-note">現職の自己評価（5=完全に満たしている）。デフォルトは満点想定です。</p>
      <div class="field-row">
        <div class="field"><label>安定性・将来性</label>${ratingButtons('b_stability', b.stability)}</div>
        <div class="field"><label>自律性</label>${ratingButtons('b_autonomy', b.autonomy)}</div>
        <div class="field"><label>WLB</label>${ratingButtons('b_wlb', b.wlb)}</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="saveSettingsBtn">設定を保存</button>
      </div>
    </div>
  </details>`;
}

function ratingButtons(prefix, current){
  let html = `<div class="rating" data-rating-group="${prefix}">`;
  for(let i=1;i<=5;i++){
    html += `<button type="button" data-val="${i}" class="${Number(current)===i?'active':''}">${i}</button>`;
  }
  html += `</div>`;
  return html;
}

function renderForm(){
  const d = formDraft;
  return `
  <div class="card">
    <h2><span class="num">${editingId ? 'EDIT' : 'NEW'}</span>${editingId ? '評価を編集' : '求人を評価する'}</h2>
    <p class="sub">求人票の本文を貼り付けて「AIで読み解く」を押すと、会社基本情報・給与レンジ・リモート詳細・雇用形態・勤務時間・休日休暇・手当福利厚生・必須歓迎スキルなどを読み取り、安定性・自律性・WLBの評価コメントと織り込んだ文章、および各軸のスコアを自動生成します。提案は下書きなので、必ず内容を確認してください。</p>

    <div class="field-row">
      <div class="field" style="flex:1 1 240px;">
        <label>会社名</label>
        <input type="text" id="f_companyName" value="${escapeAttr(d.companyName)}" placeholder="例: 株式会社◯◯">
      </div>
      <div class="field" style="flex:1 1 200px;">
        <label>経路・エージェント（任意）</label>
        <input type="text" id="f_source" value="${escapeAttr(d.source)}" placeholder="例: ◯◯エージェント">
      </div>
    </div>

    <div class="field">
      <label>求人票本文（貼り付け）</label>
      <textarea id="f_jobText" placeholder="求人票やJDの本文をここに貼り付けてください">${escapeHtml(d.jobText)}</textarea>
    </div>
    <div class="form-actions" style="justify-content:flex-start; margin-bottom:18px;">
      <button class="btn btn-ai" id="aiAnalyzeBtn" ${aiState.loading ? 'disabled' : ''}>${aiState.loading ? '読み解き中…' : 'AIで読み解く'}</button>
    </div>
    ${aiState.error ? `<p class="ai-status err">${escapeHtml(aiState.error)}</p>` : ''}

    <div class="field">
      <label>評価コメント（会社概要・給与・休暇・手当・スキル等を含む／AI生成・編集可）</label>
      <textarea class="report" id="f_report" placeholder="「AIで読み解く」を押すと、ここに統合した評価コメントが生成されます">${escapeHtml(d.report)}</textarea>
    </div>

    <div class="hardreq">
      <div class="group">
        <label class="title">リモートワーク可否</label>
        <div class="seg" data-seg="f_remote">
          <button data-val="yes" class="${d.remote==='yes'?'active':''}">可</button>
          <button data-val="no" class="${d.remote==='no'?'active':''}">不可</button>
          <button data-val="unclear" class="${d.remote==='unclear'?'active':''}">不明</button>
        </div>
      </div>
      <div class="group">
        <label class="title">AI/SaaS系プロダクト企業か</label>
        <div class="seg" data-seg="f_aiCompany">
          <button data-val="yes" class="${d.aiCompany==='yes'?'active':''}">該当</button>
          <button data-val="no" class="${d.aiCompany==='no'?'active':''}">非該当</button>
          <button data-val="unclear" class="${d.aiCompany==='unclear'?'active':''}">不明</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>提示年収（万円・求人票記載の値）</label>
        <input type="number" id="f_offeredSalary" value="${d.offeredSalary}" placeholder="例: 750">
      </div>
      <div class="field">
        <label>現職との差額（万円・自動計算／上書き可）</label>
        <input type="number" id="f_salaryGap" value="${d.salaryGap}" placeholder="例: 120">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>安定性・将来性（社風・人間関係含む）</label>
        ${ratingButtons('f_stability', d.stability)}
      </div>
      <div class="field">
        <label>自律性（裁量権・自由度）</label>
        ${ratingButtons('f_autonomy', d.autonomy)}
      </div>
      <div class="field">
        <label>WLB（働きやすさ・事業内容への興味含む）</label>
        ${ratingButtons('f_wlb', d.wlb)}
      </div>
    </div>

    <div class="field">
      <label>メモ（任意）</label>
      <textarea id="f_notes" style="min-height:60px;" placeholder="気になった点、面接で確認したいことなど">${escapeHtml(d.notes)}</textarea>
    </div>

    <div class="form-actions">
      ${editingId ? `<button class="btn btn-ghost" id="cancelEditBtn">編集をやめる</button>` : ''}
      <button class="btn btn-primary" id="saveEvalBtn">${editingId ? '更新して保存' : 'この評価を保存'}</button>
    </div>
  </div>`;
}

function renderList(base){
  const sorted = [...evaluations].sort((a,b)=> b.score - a.score);
  return `
  <div class="list-head">
    <h2 style="font-size:16px;font-weight:700;">評価一覧（${evaluations.length}件）</h2>
  </div>
  ${sorted.length===0 ? `<div class="card"><div class="empty">まだ評価がありません。求人が来たら上のフォームから登録してください。</div></div>` : sorted.map(e=>renderEntry(e, base)).join('')}
  `;
}

function renderEntry(e, base){
  const v = verdictFor(e, e.score, base);
  return `
  <div class="entry" data-id="${e.id}">
    <div class="entry-top">
      <div>
        <div class="entry-name">${escapeHtml(e.companyName || '（会社名未入力）')}</div>
        <div class="entry-meta">${e.source ? escapeHtml(e.source)+' ・ ' : ''}登録: ${new Date(e.createdAt).toLocaleDateString('ja-JP')}</div>
        <div class="badges">
          ${badge(e.remote)}
          ${badgeAI(e.aiCompany)}
        </div>
      </div>
      <div class="score-block">
        <div class="score-num">${e.score}</div>
        <div class="score-label">基準値 ${base} 点</div>
        <div class="verdict ${v.tag}">${v.label}</div>
      </div>
    </div>
    <div class="beam-row">
      ${beamSVG(e.score, base, v.tag)}
      <div class="axis-grid">
        <div><span class="axis-name">収入差額</span> <span class="axis-val">${e.salaryGap !== '' && e.salaryGap !== null ? e.salaryGap+'万円' : '未入力'}</span></div>
        <div><span class="axis-name">安定性</span> <span class="axis-val">${e.stability} / 5</span></div>
        <div><span class="axis-name">自律性</span> <span class="axis-val">${e.autonomy} / 5</span></div>
        <div><span class="axis-name">WLB</span> <span class="axis-val">${e.wlb} / 5</span></div>
      </div>
    </div>
    ${e.report ? `<div class="report-text">${escapeHtml(e.report)}</div>` : ''}
    ${e.notes ? `<details class="notes"><summary>メモを見る</summary><div class="notes-body">${escapeHtml(e.notes)}</div></details>` : ''}
    <div class="entry-actions">
      <button class="btn btn-ghost" data-action="edit" data-id="${e.id}">編集</button>
      <button class="btn btn-danger" data-action="delete" data-id="${e.id}">削除</button>
    </div>
  </div>`;
}

function badge(remote){
  if(remote==='yes') return `<span class="badge ok">リモート可</span>`;
  if(remote==='no') return `<span class="badge no">リモート不可</span>`;
  return `<span class="badge unclear">リモート不明</span>`;
}
function badgeAI(aiCompany){
  if(aiCompany==='yes') return `<span class="badge ok">AI/SaaS該当</span>`;
  if(aiCompany==='no') return `<span class="badge no">AI/SaaS非該当</span>`;
  return `<span class="badge unclear">AI/SaaS不明</span>`;
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

/* ============ toast ============ */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============ events ============ */
function bindEvents(){
  document.querySelectorAll('#settingsPanel [data-rating-group]').forEach(group=>{
    group.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = group.dataset.ratingGroup.replace('b_','');
        settings.baselineRatings[key] = Number(btn.dataset.val);
        render();
        document.getElementById('settingsPanel').setAttribute('open','');
      });
    });
  });
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn){
    saveSettingsBtn.addEventListener('click', async ()=>{
      settings.currentSalary = numOrNull(document.getElementById('currentSalary').value);
      settings.weights.income = numOrZero(document.getElementById('w_income').value);
      settings.weights.stability = numOrZero(document.getElementById('w_stability').value);
      settings.weights.autonomy = numOrZero(document.getElementById('w_autonomy').value);
      settings.weights.wlb = numOrZero(document.getElementById('w_wlb').value);
      await saveJSON('settings', settings);
      showToast('設定を保存しました');
      render();
      document.getElementById('settingsPanel').setAttribute('open','');
    });
  }

  document.querySelectorAll('.card [data-rating-group]').forEach(group=>{
    group.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = group.dataset.ratingGroup.replace('f_','');
        formDraft[key] = Number(btn.dataset.val);
        render();
      });
    });
  });

  document.querySelectorAll('[data-seg]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const field = seg.dataset.seg.replace('f_','');
        formDraft[field] = btn.dataset.val;
        render();
      });
    });
  });

  bindIfExists('f_companyName','input', e=> formDraft.companyName = e.target.value);
  bindIfExists('f_source','input', e=> formDraft.source = e.target.value);
  bindIfExists('f_jobText','input', e=> formDraft.jobText = e.target.value);
  bindIfExists('f_report','input', e=> formDraft.report = e.target.value);
  bindIfExists('f_notes','input', e=> formDraft.notes = e.target.value);
  bindIfExists('f_offeredSalary','input', e=>{
    formDraft.offeredSalary = e.target.value;
    if(settings.currentSalary !== null && e.target.value !== ''){
      formDraft.salaryGap = String(Math.round(Number(e.target.value) - settings.currentSalary));
      const gapEl = document.getElementById('f_salaryGap');
      if(gapEl) gapEl.value = formDraft.salaryGap;
    }
  });
  bindIfExists('f_salaryGap','input', e=> formDraft.salaryGap = e.target.value);

  const aiBtn = document.getElementById('aiAnalyzeBtn');
  if(aiBtn) aiBtn.addEventListener('click', runAIAnalysis);

  const saveEvalBtn = document.getElementById('saveEvalBtn');
  if(saveEvalBtn) saveEvalBtn.addEventListener('click', saveEvaluation);

  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{ editingId = null; formDraft = blankDraft(); render(); });

  document.querySelectorAll('[data-action="edit"]').forEach(b=>{ b.addEventListener('click', ()=> startEdit(b.dataset.id)); });
  document.querySelectorAll('[data-action="delete"]').forEach(b=>{ b.addEventListener('click', ()=> deleteEvaluation(b.dataset.id)); });
}

function bindIfExists(id, evt, handler){ const node = document.getElementById(id); if(node) node.addEventListener(evt, handler); }
function numOrNull(v){ return (v==='' || v===null || isNaN(v)) ? null : Number(v); }
function numOrZero(v){ return isNaN(Number(v)) ? 0 : Number(v); }

/* ============ AI analysis ============ */
async function runAIAnalysis(){
  if(!formDraft.jobText || formDraft.jobText.trim().length < 10){
    aiState.error = '求人票の本文を貼り付けてから実行してください。';
    render();
    return;
  }
  aiState.loading = true; aiState.error = null;
  render();

  const systemPrompt = `あなたは転職活動中のユーザーの求人票読み解きを支援します。ユーザーは現在、安定性(社風・人間関係・将来性)、自律性(裁量権・自由度)、ワークライフバランス(働きやすさ・服装文化・事業内容への興味含む)の3つの観点では現職に満足していますが、収入面に大きな不満があり転職を検討しています。
以下の求人票本文を読み、必ず次のJSON形式のみで出力してください。説明文やMarkdownのコードブロックは一切付けないでください。
{
"company_name": "求人票から読み取った正式な会社名(不明ならnull)",
"remote_work": "yes|no|unclear",
"ai_product_company": "yes|no|unclear",
"salary_annual_min": 想定年収の下限を万円の数値のみで(記載なければnull),
"salary_annual_max": 想定年収の上限を万円の数値のみで(記載なければnull),
"stability_score": 1から5の整数,
"autonomy_score": 1から5の整数,
"wlb_score": 1から5の整数,
"report": "会社の基本情報(会社名・本社所在地・設立年)、企業概要(資金調達・従業員数・主要取引先など)、給与レンジの内訳、勤務地・リモートワークの詳細(出社頻度など)、雇用形態・試用期間、勤務時間・フレックス制度、休日・休暇の種類、手当・福利厚生、必須スキル・歓迎スキルを、安定性・自律性・WLBの評価コメントに織り込みながら自然な日本語の文章で書いたもの。見出しや箇条書きは使わず段落で書く。400〜600文字程度を目安にする。"
}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{ role:"user", content: formDraft.jobText }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b=> b.type === 'text');
    if(!textBlock) throw new Error('no text response');
    const cleaned = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);

    if(parsed.company_name && !formDraft.companyName){ formDraft.companyName = parsed.company_name; }
    formDraft.remote = ['yes','no','unclear'].includes(parsed.remote_work) ? parsed.remote_work : 'unclear';
    formDraft.aiCompany = ['yes','no','unclear'].includes(parsed.ai_product_company) ? parsed.ai_product_company : 'unclear';
    if(parsed.stability_score) formDraft.stability = clamp(Math.round(parsed.stability_score),1,5);
    if(parsed.autonomy_score) formDraft.autonomy = clamp(Math.round(parsed.autonomy_score),1,5);
    if(parsed.wlb_score) formDraft.wlb = clamp(Math.round(parsed.wlb_score),1,5);
    if(parsed.salary_annual_min){
      formDraft.offeredSalary = String(parsed.salary_annual_min);
      if(settings.currentSalary !== null){
        formDraft.salaryGap = String(Math.round(Number(parsed.salary_annual_min) - settings.currentSalary));
      }
    }
    if(parsed.report) formDraft.report = parsed.report;

    aiState.loading = false;
    render();
  }catch(err){
    console.error(err);
    aiState.loading = false;
    aiState.error = 'AIによる読み解きに失敗しました。お手数ですが項目を手動で入力してください。';
    render();
  }
}

/* ============ CRUD ============ */
async function saveEvaluation(){
  if(!formDraft.companyName || !formDraft.companyName.trim()){
    showToast('会社名を入力してください');
    return;
  }
  const score = totalScore({
    gap: formDraft.salaryGap, stability: formDraft.stability, autonomy: formDraft.autonomy, wlb: formDraft.wlb
  }, settings.weights);

  if(editingId){
    const idx = evaluations.findIndex(e=> e.id === editingId);
    if(idx>-1){
      evaluations[idx] = { ...evaluations[idx], ...formDraft, score, salaryGap: formDraft.salaryGap===''?null:Number(formDraft.salaryGap) };
    }
    editingId = null;
  }else{
    evaluations.push({
      id: 'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      createdAt: Date.now(), ...formDraft,
      salaryGap: formDraft.salaryGap===''?null:Number(formDraft.salaryGap),
      score
    });
  }
  await saveJSON('evaluations', evaluations);
  formDraft = blankDraft();
  aiState = { loading:false, error:null };
  showToast('評価を保存しました');
  render();
}

function startEdit(id){
  const e = evaluations.find(x=> x.id===id);
  if(!e) return;
  editingId = id;
  formDraft = {
    companyName:e.companyName, source:e.source||'', jobText:e.jobText||'',
    offeredSalary:e.offeredSalary||'', salaryGap: e.salaryGap===null||e.salaryGap===undefined?'':String(e.salaryGap),
    remote:e.remote||'unclear', aiCompany:e.aiCompany||'unclear',
    stability:e.stability, autonomy:e.autonomy, wlb:e.wlb,
    report:e.report||'', notes:e.notes||''
  };
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteEvaluation(id){
  evaluations = evaluations.filter(e=> e.id !== id);
  await saveJSON('evaluations', evaluations);
  showToast('削除しました');
  render();
}

/* ============ init ============ */
async function init(){
  settings = await loadJSON('settings', DEFAULT_SETTINGS);
  evaluations = await loadJSON('evaluations', []);
  render();
}
init();
</script>
